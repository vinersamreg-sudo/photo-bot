# Separate vhost on the NEW host only. No private file serving or redirects.
limit_req_zone $binary_remote_addr zone=ravuna_max_ingress:10m rate=10r/s;
log_format ravuna_max_status '$status $request_time $upstream_status';
server {
    listen 443 ssl;
    server_name max-webhook.ravuna.ru;
    ssl_certificate /etc/letsencrypt/live/max-webhook.ravuna.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max-webhook.ravuna.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/ravuna-max-access.log ravuna_max_status;
    error_log /dev/null crit;

    location = /webhooks/max {
        limit_except POST { deny all; }
        limit_req zone=ravuna_max_ingress burst=25 nodelay;
        limit_req_status 503;
        client_max_body_size 128k;
        client_body_buffer_size 128k;
        client_body_timeout 5s;
        proxy_request_buffering on;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_pass http://127.0.0.1:8092/webhooks/max;
        proxy_set_header Host localhost;
        proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    }

    location / { return 404; }
}
