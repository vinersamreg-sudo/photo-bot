# Public Avito callback boundary. The application validates the 43-character
# secret path exactly and authenticates the referenced message through Avito API.
location ~ "^/integrations/avito/[A-Za-z0-9_-]{43}/messages$" {
    if ($request_method != POST) {
        return 405;
    }

    client_max_body_size 128k;
    limit_req zone=ravuna_avito_webhook burst=5 nodelay;

    proxy_pass http://127.0.0.1:8093;
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Type $content_type;
    proxy_set_header Content-Length $content_length;
    proxy_set_header Connection "";
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    access_log off;
    error_log /dev/null crit;
}
