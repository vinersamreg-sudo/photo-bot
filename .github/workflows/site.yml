name: Pixora site CI and deploy

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixora-site-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stamp artifact version
        shell: bash
        run: printf '%s\n' "$GITHUB_SHA" > site/public/version.txt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Run structural and HTTP smoke tests
        shell: pwsh
        run: |
          python -m unittest discover -s site/tests -v
          $server = Start-Process python -ArgumentList '-m','http.server','4173','--bind','127.0.0.1','--directory','site/public' -PassThru
          try {
            Start-Sleep -Seconds 1
            ./site/scripts/smoke.ps1
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
      - name: Measure Lighthouse budgets
        working-directory: site
        run: |
          npm ci
          npm audit --audit-level=high
          python -m http.server 4173 --bind 127.0.0.1 --directory public &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          mkdir -p .lighthouse
          npm run lighthouse
      - name: Preserve Lighthouse diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pixora-lighthouse-${{ github.sha }}
          path: site/.lighthouse/report-*.json
          if-no-files-found: warn
      - name: Enforce Lighthouse budgets
        run: |
          python site/scripts/assert_lighthouse.py site/.lighthouse/report-mobile.json
          python site/scripts/assert_lighthouse.py site/.lighthouse/report-desktop.json
      - uses: actions/upload-artifact@v6
        with:
          name: pixora-site-${{ github.sha }}
          path: site/public
          if-no-files-found: error

  deploy:
    needs: test
    if: vars.PIXORA_SITE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Stamp release version
        run: printf '%s\n' "$GITHUB_SHA" > site/public/version.txt
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_HOST" && test -n "$SSH_PORT"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Deploy immutable release
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          RELEASE="/opt/pixora-site/releases/$GITHUB_SHA"
          STAGING="/opt/pixora-site/releases/.${GITHUB_SHA}.staging"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "set -eu
            mkdir -p /opt/pixora-site/releases /opt/pixora-site/shared/acme
            rm -rf '$STAGING'
            mkdir '$STAGING'"
          rsync -az --delete --chmod=D755,F644 -e "ssh -p $SSH_PORT" site/public/ "$SSH_USER@$SSH_HOST:$STAGING/"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "set -eu
            BASE=/opt/pixora-site
            test -f '$STAGING/index.html'
            test -f '$STAGING/styles.css'
            test \"\$(cat '$STAGING/version.txt')\" = '$GITHUB_SHA'
            test -z \"\$(find '$STAGING' -type l -print -quit)\"
            test -z \"\$(find '$STAGING' -type f \\( -name '.env' -o -name '*.sqlite*' -o -name '*.log' -o -name '*.map' -o -name '*.bak' \\) -print -quit)\"
            chmod -R a-w '$STAGING'
            if test -d '$RELEASE'; then
              diff -qr '$STAGING' '$RELEASE' >/dev/null
              chmod -R u+w '$STAGING'
              rm -rf '$STAGING'
            else
              mv '$STAGING' '$RELEASE'
            fi
            OLD=\"\$(readlink -f \"\$BASE/current\" 2>/dev/null || true)\"
            case \"\$OLD\" in \"\$BASE\"/releases/*) ln -sfn \"\$OLD\" \"\$BASE/previous.tmp\"; mv -Tf \"\$BASE/previous.tmp\" \"\$BASE/previous\" ;; '') ;; *) echo 'Unsafe current target' >&2; exit 1 ;; esac
            ln -sfn '$RELEASE' \"\$BASE/current.tmp\"
            mv -Tf \"\$BASE/current.tmp\" \"\$BASE/current\"
            printf '%s\n' '$GITHUB_SHA' > \"\$BASE/deployed_commit.txt\"
            if ! curl --fail --silent --show-error --resolve pixoraai.ru:443:127.0.0.1 https://pixoraai.ru/ >/dev/null; then
              if test -n \"\$OLD\"; then ln -sfn \"\$OLD\" \"\$BASE/current.tmp\"; mv -Tf \"\$BASE/current.tmp\" \"\$BASE/current\"; fi
              echo 'Release smoke failed; current restored' >&2
              exit 1
            fi"
