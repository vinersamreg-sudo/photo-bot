name: Ravuna site CI

on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
      - ".github/workflows/site-deploy.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
      - ".github/workflows/site-deploy.yml"

permissions:
  contents: read

concurrency:
  group: ravuna-site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Site release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stamp artifact version
        shell: bash
        run: printf '%s\n' "$GITHUB_SHA" > site/public/version.txt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Run structural and HTTP smoke tests
        shell: pwsh
        run: |
          python -m unittest discover -s site/tests -v
          $server = Start-Process python -ArgumentList '-m','http.server','4173','--bind','127.0.0.1','--directory','site/public' -PassThru
          try {
            Start-Sleep -Seconds 1
            ./site/scripts/smoke.ps1
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
      - name: Measure Lighthouse budgets
        working-directory: site
        run: |
          npm ci
          npm audit --audit-level=high
          python -m http.server 4173 --bind 127.0.0.1 --directory public &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          mkdir -p .lighthouse
          npm run lighthouse
      - name: Preserve Lighthouse diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ravuna-lighthouse-${{ github.sha }}
          path: site/.lighthouse/report-*.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Enforce Lighthouse budgets
        run: |
          python site/scripts/assert_lighthouse.py site/.lighthouse/report-mobile.json
          python site/scripts/assert_lighthouse.py site/.lighthouse/report-desktop.json
      - uses: actions/upload-artifact@v6
        with:
          name: ravuna-site-${{ github.sha }}
          path: site/public
          if-no-files-found: error
