name: Ravuna backup freshness watchdog

on:
  schedule:
    - cron: '43 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check complete scheduled backup success, not readback-only success
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/backup.yml/runs" -f branch="$DEFAULT_BRANCH" -f event=schedule -F per_page=10 > backup-runs.json
          python - <<'PY'
          import json, sys
          from datetime import datetime, timedelta, timezone
          with open("backup-runs.json", encoding="utf-8") as f:
              runs = json.load(f)["workflow_runs"]
          now = datetime.now(timezone.utc)
          successes = [run for run in runs if run["conclusion"] == "success"]
          if not successes:
              sys.exit("::error::No successful scheduled Ravuna recovery was found.")
          newest = max(datetime.fromisoformat(run["run_started_at"].replace("Z", "+00:00")) for run in successes)
          if now - newest > timedelta(hours=30):
              sys.exit("::error::Last complete scheduled Ravuna recovery is older than 30 hours.")
          print(f"Most recent scheduled recovery run started at {newest.isoformat()}")
          PY
