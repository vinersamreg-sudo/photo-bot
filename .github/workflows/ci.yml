name: Ravuna CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ravuna-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Canonical release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Scan tracked files and asset licenses
        run: |
          python scripts/scan_secrets.py
          python scripts/check_asset_licenses.py
      - name: Validate Ravuna nginx candidate with nginx
        run: |
          CERT_DIR="$RUNNER_TEMP/ravuna-nginx-cert"
          install -d "$CERT_DIR"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$CERT_DIR/privkey.pem" \
            -out "$CERT_DIR/fullchain.pem" \
            -subj '/CN=ravuna.ru' >/dev/null 2>&1
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/site/nginx/ravuna.ru.conf:/etc/nginx/conf.d/ravuna.conf:ro" \
            --volume "$CERT_DIR:/etc/letsencrypt/live/ravuna.ru:ro" \
            nginx:1.27-alpine nginx -t
      - name: Run release-sensitive profiles
        run: |
          python scripts/test_fast.py payments
          python scripts/test_fast.py max
          python scripts/test_fast.py providers
          python -m unittest -q \
            tests.test_content_studio \
            tests.test_content_studio_growth \
            tests.test_content_studio_transports \
            tests.test_deploy_policy
      - name: Run full release suite
        run: python scripts/test_release.py
