name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photo-bot-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    env:
      OPENAI_KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Scan tracked files for secrets
        run: python scripts/scan_secrets.py
      - name: Run unit tests and healthcheck
        env:
          APP_ENV: ci
          BASE_DIR: ${{ github.workspace }}
        run: |
          python -m unittest discover -v
          python -m app.main health
      - name: Validate OpenAI credential from GitHub runner
        if: env.OPENAI_KEY_CONFIGURED == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
          APP_ENV: ci
        run: python -m app.main openai-check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_CONFIGURED: ${{ secrets.HETZNER_HOST != '' && secrets.HETZNER_USER != '' && secrets.HETZNER_SSH_PRIVATE_KEY != '' && secrets.HETZNER_SSH_PORT != '' }}
      OPENAI_KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - name: Require Hetzner deployment configuration
        if: env.DEPLOY_CONFIGURED != 'true'
        run: |
          echo "Hetzner production secrets are incomplete." >&2
          exit 1
      - uses: actions/checkout@v7
        if: env.DEPLOY_CONFIGURED == 'true'
      - name: Configure SSH
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Synchronize application files
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='venv/' \
            --exclude='data/' \
            --exclude='logs/' \
            --exclude='temp/' \
            -e "ssh -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:/opt/photo-bot/"
      - name: Configure OpenAI credential
        if: env.DEPLOY_CONFIGURED == 'true' && env.OPENAI_KEY_CONFIGURED == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          printf '%s' "$OPENAI_API_KEY" | \
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -e
            ROOT=/opt/photo-bot
            KEY=$(cat)
            test -n "$KEY"
            TMP="$ROOT/.env.tmp"
            grep -v "^OPENAI_API_KEY=" "$ROOT/.env" > "$TMP" || true
            printf "%s\n" "OPENAI_API_KEY=$KEY" >> "$TMP"
            chmod 600 "$TMP"
            mv "$TMP" "$ROOT/.env"
            unset KEY'
      - name: Install and verify production
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' -- "$GITHUB_SHA" <<'REMOTE'
            set -euo pipefail
            ROOT=/opt/photo-bot
            DEPLOY_SHA="$1"
            test "$(id -un)" = "photoapp"
            test "$(stat -c '%U:%G' "$ROOT")" = "photoapp:photoapp"
            mkdir -p "$ROOT/data" "$ROOT/logs" "$ROOT/temp"
            if [ ! -f "$ROOT/.env" ]; then
              install -m 600 /dev/null "$ROOT/.env"
            else
              chmod 600 "$ROOT/.env"
            fi
            grep -q '^OPENAI_IMAGE_MODEL=' "$ROOT/.env" || printf '%s\n' 'OPENAI_IMAGE_MODEL=gpt-image-2' >> "$ROOT/.env"
            grep -q '^APP_ENV=' "$ROOT/.env" || printf '%s\n' 'APP_ENV=production' >> "$ROOT/.env"
            grep -q '^BASE_DIR=' "$ROOT/.env" || printf '%s\n' 'BASE_DIR=/opt/photo-bot' >> "$ROOT/.env"
            ensure_env() { grep -q "^$1=" "$ROOT/.env" || printf '%s=%s\n' "$1" "$2" >> "$ROOT/.env"; }
            ensure_env DEMO_MAX_SUCCESSFUL_GENERATIONS 5
            ensure_env DEMO_SESSION_TTL_MINUTES 60
            ensure_env DEMO_WATERMARK_TEXT ОБРАЗЕЦ
            ensure_env DEMO_MAX_DIMENSION 1024
            ensure_env DEMO_OUTPUT_FORMAT JPEG
            ensure_env DEMO_JPEG_QUALITY 82
            ensure_env DEMO_MIN_REQUEST_INTERVAL_SECONDS 15
            ensure_env DEMO_MAX_ATTEMPTS_PER_HOUR 10
            ensure_env DEMO_MAX_CONCURRENT_PER_USER 1
            ensure_env GLOBAL_MAX_CONCURRENT_GENERATIONS 2
            ensure_env DEMO_DAILY_COST_LIMIT_RUB 1000
            ensure_env DEMO_DAILY_GENERATION_LIMIT 100
            ensure_env DEMO_ESTIMATED_COST_RUB_PER_GENERATION 10
            ensure_env MAX_SOURCE_FILE_SIZE_MB 15
            ensure_env MAX_PROMPT_LENGTH 1500
            ensure_env GENERATION_TIMEOUT_SECONDS 300
            ensure_env UNLOCK_ORIGINAL_PRICE_RUB 149
            chmod +x "$ROOT"/scripts/*.sh
            cd "$ROOT"
            "$ROOT"/venv/bin/pip install -r "$ROOT"/requirements.txt
            "$ROOT"/venv/bin/python --version
            "$ROOT"/venv/bin/pip check
            "$ROOT"/venv/bin/python -m unittest discover -v
            "$ROOT"/scripts/healthcheck.sh
            test "$(stat -c '%a' "$ROOT/.env")" = "600"
            for dir in "$ROOT/data" "$ROOT/logs" "$ROOT/temp"; do
              test -d "$dir"
              test -w "$dir"
            done
            if [ -d "$ROOT/data/users" ]; then
              test "$(stat -c '%a' "$ROOT/data/users")" = "700"
            fi
            if [ -f "$ROOT/data/photo_bot.sqlite3" ]; then
              test "$(stat -c '%a' "$ROOT/data/photo_bot.sqlite3")" = "600"
            fi
            for path in app tests scripts docs requirements.txt README.md AI_REPOSITORY_CONTEXT.md; do
              test -e "$ROOT/$path"
            done
            if [ -f "$ROOT/logs/app.log" ] && grep -Eq '(OPENAI_API_KEY|sk-[A-Za-z0-9_-]{20,})' "$ROOT/logs/app.log"; then
              echo "Potential secret material detected in app.log" >&2
              exit 1
            fi
            printf '%s\n' "$DEPLOY_SHA" > "$ROOT/data/deployed_commit.txt.tmp"
            mv "$ROOT/data/deployed_commit.txt.tmp" "$ROOT/data/deployed_commit.txt"
            if grep -Eq '^OPENAI_API_KEY=.+$' "$ROOT/.env"; then
              "$ROOT"/venv/bin/python -m app.main openai-check
            else
              echo "OPENAI_API_KEY is not configured; external API check skipped"
            fi
          REMOTE
