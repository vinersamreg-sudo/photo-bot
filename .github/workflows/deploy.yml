      - name: Verify ResultURL transport
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            GET_STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --resolve pixoraai.ru:443:127.0.0.1 \
              https://pixoraai.ru/payments/robokassa/result)
            test "$GET_STATUS" = 405
            printf 'resulturl_get_status=%s\n' "$GET_STATUS"
            WEBHOOK_ENABLED=$(grep '^PAYMENT_WEBHOOK_ENABLED=' /opt/photo-bot/.env | tail -n 1 | cut -d= -f2- | tr '[:upper:]' '[:lower:]')
            if [ "$WEBHOOK_ENABLED" = true ]; then
              printf 'resulturl_post_probe=skipped_enabled\n'
            else
              POST_STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --resolve pixoraai.ru:443:127.0.0.1 \
                --request POST --data 'readiness_probe=1' \
                https://pixoraai.ru/payments/robokassa/result)
              test "$POST_STATUS" = 503
              printf 'resulturl_post_disabled_status=%s\n' "$POST_STATUS"
            fi
          REMOTE
      - name: Reset owner dialog to a clean main-menu state
        if: >-
          env.DEPLOY_CONFIGURED == 'true' && github.event_name == 'workflow_dispatch' &&
          inputs.reset_owner_dialog == true
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            cd /opt/photo-bot
            venv/bin/python - <<'PY'
          from app.config import load_settings
          from app.database import Database
          from app.max_conversation import MaxConversationStore

          settings = load_settings()
          store = MaxConversationStore(Database(settings.database_path))
          reset_count = 0
          for owner_id in settings.max_owner_user_ids:
              if store.get(owner_id) is None:
                  continue
              store.transition(
                  owner_id,
                  "main_menu",
                  event_key="ops:owner-dialog-reset",
                  force=True,
                  selected_scenario_id=None,
                  session_id=None,
                  pending_prompt=None,
                  pending_action=None,
                  current_gallery_item_id=None,
                  current_version_id=None,
                  gallery_cursor=0,
                  status_message_id=None,
              )
              reset_count += 1
          if reset_count == 0:
              raise SystemExit("No allowlisted owner dialog was available to reset")
          print(f"owner_dialogs_reset={reset_count}")
          PY
          REMOTE
      - name: Grant bounded owner E2E attempts
        if: >-
          env.DEPLOY_CONFIGURED == 'true' && github.event_name == 'workflow_dispatch' &&
          inputs.grant_owner_e2e_attempts == '5'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            cd /opt/photo-bot
            venv/bin/python - <<'PY'
          from app.config import load_settings
          from app.commerce import CommerceService
          from app.database import Database

          settings = load_settings()
          database = Database(settings.database_path)
          granted_count = 0
          with database.transaction() as connection:
              for owner_id in settings.max_owner_user_ids:
                  row = connection.execute(
                      """SELECT id FROM users
                         WHERE platform='max' AND platform_user_id=?""",
                      (owner_id,),
                  ).fetchone()
                  if row is None:
                      continue
                  CommerceService(database).adjust_generation_credits(
                      connection,
                      user_id=row["id"],
                      delta=5,
                      reason="explicit_workflow_dispatch_owner_e2e",
                      idempotency_key=f"owner-e2e:{row['id']}:{settings.app_env}",
                  )
                  granted_count += 1
          if granted_count == 0:
              raise SystemExit("No allowlisted owner account was available")
          print(f"owner_e2e_accounts_adjusted={granted_count}")
          print("owner_e2e_generation_credits_adjusted=5")
          PY
          REMOTE
