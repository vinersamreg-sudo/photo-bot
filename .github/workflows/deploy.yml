name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_owner_handlers:
        description: Temporarily enable owner-only MAX application handlers
        required: false
        type: boolean
        default: false
      reset_owner_dialog:
        description: Reset allowlisted owner dialog bindings after deployment
        required: false
        type: boolean
        default: false
      grant_owner_e2e_attempts:
        description: Add a bounded number of attempts to the existing owner demo session
        required: false
        type: choice
        options: ['0', '5']
        default: '0'
      pilot_user_limit:
        description: Number of explicitly allowlisted closed-pilot users
        required: false
        type: choice
        options: ['0', '5', '10', '20']
        default: '0'

permissions:
  contents: read

concurrency:
  group: photo-bot-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    env:
      OPENAI_KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
      MAX_KEY_CONFIGURED: ${{ secrets.MAX_BOT_TOKEN != '' }}
      MAX_OWNER_CONFIGURED: ${{ secrets.MAX_OWNER_USER_ID != '' }}
      MAX_PILOT_CONFIGURED: ${{ secrets.MAX_PILOT_USER_IDS != '' }}
      MAX_OWNER_HANDLERS_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_owner_handlers == true }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Validate closed-pilot rollout configuration
        if: github.event_name == 'workflow_dispatch' && inputs.pilot_user_limit != '0'
        env:
          PILOT_USER_LIMIT: ${{ inputs.pilot_user_limit }}
          MAX_PILOT_USER_IDS: ${{ secrets.MAX_PILOT_USER_IDS }}
          MAX_OWNER_USER_ID: ${{ secrets.MAX_OWNER_USER_ID }}
        run: |
          python - <<'PY'
          import os

          limit = int(os.environ["PILOT_USER_LIMIT"])
          pilots = tuple(dict.fromkeys(
              value.strip()
              for value in os.environ.get("MAX_PILOT_USER_IDS", "").split(",")
              if value.strip()
          ))
          owner = os.environ.get("MAX_OWNER_USER_ID", "").strip()
          if len(pilots) < limit:
              raise SystemExit("Pilot allowlist is shorter than the requested rollout stage")
          if owner and owner in pilots:
              raise SystemExit("Pilot allowlist must not contain the owner")
          print(f"pilot_rollout_validated={limit}")
          PY
      - name: Scan tracked files for secrets
        run: |
          python scripts/scan_secrets.py
          python scripts/check_asset_licenses.py
      - name: Run unit tests and healthcheck
        env:
          APP_ENV: ci
          BASE_DIR: ${{ github.workspace }}
        run: |
          python -m unittest discover -v
          python -m app.main health
      - name: Validate OpenAI credential from GitHub runner
        if: env.OPENAI_KEY_CONFIGURED == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
          APP_ENV: ci
        run: python -m app.main openai-check
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_CONFIGURED: ${{ secrets.HETZNER_HOST != '' && secrets.HETZNER_USER != '' && secrets.HETZNER_SSH_PRIVATE_KEY != '' && secrets.HETZNER_SSH_PORT != '' }}
      OPENAI_KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
      MAX_KEY_CONFIGURED: ${{ secrets.MAX_BOT_TOKEN != '' }}
      MAX_OWNER_CONFIGURED: ${{ secrets.MAX_OWNER_USER_ID != '' }}
    steps:
      - name: Require Hetzner deployment configuration
        if: env.DEPLOY_CONFIGURED != 'true'
        run: |
          echo "Hetzner production secrets are incomplete." >&2
          exit 1
      - uses: actions/checkout@v7
        if: env.DEPLOY_CONFIGURED == 'true'
      - name: Configure SSH
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Require idle production before deployment
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            if [ -f /opt/photo-bot/data/photo_bot.sqlite3 ] && [ -x /opt/photo-bot/venv/bin/python ]; then
              /opt/photo-bot/venv/bin/python - <<'PY'
          import sqlite3

          connection = sqlite3.connect("/opt/photo-bot/data/photo_bot.sqlite3")
          try:
              active = connection.execute(
                  """SELECT
                         (SELECT COUNT(*) FROM generation_attempts
                          WHERE status IN ('pending','processing')) +
                         (SELECT COUNT(*) FROM max_dialogs WHERE state='processing')"""
              ).fetchone()[0]
          finally:
              connection.close()
          if active:
              raise SystemExit("Deployment paused: active processing is present")
          print("active_processing=0")
          PY
            fi
          REMOTE
      - name: Synchronize application files
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" '
            if systemctl cat photo-bot.service >/dev/null 2>&1; then
              sudo -n systemctl stop photo-bot.service
            fi
            if [ -f /opt/photo-bot/data/photo-bot.pid ]; then
              /opt/photo-bot/scripts/stop_bot.sh
            fi'
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='venv/' \
            --exclude='data/' \
            --exclude='logs/' \
            --exclude='temp/' \
            --exclude='site/' \
            -e "ssh -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:/opt/photo-bot/"
      - name: Configure OpenAI credential
        if: env.DEPLOY_CONFIGURED == 'true' && env.OPENAI_KEY_CONFIGURED == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          printf '%s' "$OPENAI_API_KEY" | \
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -e
            ROOT=/opt/photo-bot
            KEY=$(cat)
            test -n "$KEY"
            TMP="$ROOT/.env.tmp"
            grep -v "^OPENAI_API_KEY=" "$ROOT/.env" > "$TMP" || true
            printf "%s\n" "OPENAI_API_KEY=$KEY" >> "$TMP"
            chmod 600 "$TMP"
            mv "$TMP" "$ROOT/.env"
            unset KEY'
      - name: Configure MAX credential
        if: env.DEPLOY_CONFIGURED == 'true' && env.MAX_KEY_CONFIGURED == 'true'
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          printf '%s' "$MAX_BOT_TOKEN" | \
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -e
            ROOT=/opt/photo-bot
            KEY=$(cat)
            test -n "$KEY"
            TMP="$ROOT/.env.tmp"
            grep -v "^MAX_BOT_TOKEN=" "$ROOT/.env" > "$TMP" || true
            printf "%s\n" "MAX_BOT_TOKEN=$KEY" >> "$TMP"
            chmod 600 "$TMP"
            mv "$TMP" "$ROOT/.env"
            unset KEY'
      - name: Configure MAX owner allowlist
        if: env.DEPLOY_CONFIGURED == 'true' && env.MAX_OWNER_CONFIGURED == 'true'
        env:
          MAX_OWNER_USER_ID: ${{ secrets.MAX_OWNER_USER_ID }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          printf '%s' "$MAX_OWNER_USER_ID" | \
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -e
            ROOT=/opt/photo-bot
            OWNER_ID=$(cat)
            test -n "$OWNER_ID"
            TMP="$ROOT/.env.tmp"
            grep -v "^MAX_OWNER_USER_IDS=" "$ROOT/.env" > "$TMP" || true
            printf "%s\n" "MAX_OWNER_USER_IDS=$OWNER_ID" >> "$TMP"
            chmod 600 "$TMP"
            mv "$TMP" "$ROOT/.env"
            unset OWNER_ID'
      - name: Disable MAX handlers without owner secret
        if: env.DEPLOY_CONFIGURED == 'true' && env.MAX_OWNER_CONFIGURED != 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -e
            ROOT=/opt/photo-bot
            TMP="$ROOT/.env.tmp"
            grep -v "^MAX_OWNER_USER_IDS=" "$ROOT/.env" > "$TMP" || true
            printf "%s\n" "MAX_OWNER_USER_IDS=" >> "$TMP"
            chmod 600 "$TMP"
            mv "$TMP" "$ROOT/.env"'
      - name: Configure closed-pilot allowlist
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          MAX_PILOT_USER_IDS: ${{ secrets.MAX_PILOT_USER_IDS }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          printf '%s' "$MAX_PILOT_USER_IDS" | \
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -e
            ROOT=/opt/photo-bot
            PILOT_IDS=$(cat)
            TMP="$ROOT/.env.tmp"
            grep -v "^MAX_PILOT_USER_IDS=" "$ROOT/.env" > "$TMP" || true
            printf "%s\n" "MAX_PILOT_USER_IDS=$PILOT_IDS" >> "$TMP"
            chmod 600 "$TMP"
            mv "$TMP" "$ROOT/.env"
            unset PILOT_IDS'
      - name: Install and verify production
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          MAX_OWNER_HANDLERS_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_owner_handlers == true }}
          PILOT_USER_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.pilot_user_limit || '0' }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' -- "$GITHUB_SHA" "$MAX_OWNER_HANDLERS_ENABLED" "$PILOT_USER_LIMIT" <<'REMOTE'
            set -euo pipefail
            ROOT=/opt/photo-bot
            DEPLOY_SHA="$1"
            MAX_OWNER_HANDLERS_ENABLED="${2:-false}"
            PILOT_USER_LIMIT="${3:-0}"
            test "$(id -un)" = "photoapp"
            test "$(stat -c '%U:%G' "$ROOT")" = "photoapp:photoapp"
            mkdir -p "$ROOT/data" "$ROOT/logs" "$ROOT/temp"
            if [ ! -f "$ROOT/.env" ]; then
              install -m 600 /dev/null "$ROOT/.env"
            else
              chmod 600 "$ROOT/.env"
            fi
            ensure_env() { grep -q "^$1=" "$ROOT/.env" || printf '%s=%s\n' "$1" "$2" >> "$ROOT/.env"; }
            ensure_env DEMO_MAX_SUCCESSFUL_GENERATIONS 5
            ensure_env IMAGE_EDIT_QUALITY medium
            ensure_env IMAGE_EDIT_SIZE 1024x1024
            ensure_env IMAGE_EDIT_INPUT_FIDELITY auto
            ensure_env IMAGE_EDIT_OUTPUT_FORMAT png
            ensure_env OPENAI_MAX_RETRIES 2
            ensure_env DEMO_SESSION_TTL_MINUTES 60
            ensure_env DEMO_WATERMARK_TEXT ОБРАЗЕЦ
            ensure_env DEMO_MAX_DIMENSION 1024
            ensure_env DEMO_OUTPUT_FORMAT JPEG
            ensure_env DEMO_JPEG_QUALITY 82
            ensure_env DEMO_MIN_REQUEST_INTERVAL_SECONDS 15
            ensure_env DEMO_MAX_ATTEMPTS_PER_HOUR 10
            ensure_env DEMO_MAX_CONCURRENT_PER_USER 1
            ensure_env GLOBAL_MAX_CONCURRENT_GENERATIONS 2
            ensure_env DEMO_DAILY_COST_LIMIT_RUB 1000
            ensure_env DEMO_DAILY_GENERATION_LIMIT 100
            ensure_env DEMO_ESTIMATED_COST_RUB_PER_GENERATION 10
            ensure_env MAX_SOURCE_FILE_SIZE_MB 15
            ensure_env MAX_PROMPT_LENGTH 1500
            ensure_env GENERATION_TIMEOUT_SECONDS 300
            ensure_env UNLOCK_ORIGINAL_PRICE_RUB 149
            ensure_env DEMO_RETENTION_DAYS 30
            ensure_env PAID_RETENTION_DAYS 180
            ensure_env TRASH_RETENTION_DAYS 30
            ensure_env MAX_BOT_TOKEN ''
            ensure_env MAX_OWNER_USER_IDS ''
            ensure_env MAX_PILOT_USER_IDS ''
            ensure_env MAX_API_BASE_URL https://platform-api2.max.ru
            ensure_env MAX_CA_BUNDLE ops/certs/russian_trusted_root_ca_pem.crt
            set_env() {
              NAME="$1"
              VALUE="$2"
              TMP="$ROOT/.env.runtime.tmp"
              grep -v "^$NAME=" "$ROOT/.env" > "$TMP" || true
              printf '%s=%s\n' "$NAME" "$VALUE" >> "$TMP"
              chmod 600 "$TMP"
              mv "$TMP" "$ROOT/.env"
            }
            set_env OPENAI_IMAGE_MODEL gpt-image-2
            set_env APP_ENV production
            set_env BASE_DIR /opt/photo-bot
            if grep -Eq '^MAX_BOT_TOKEN=.+$' "$ROOT/.env"; then
              set_env MAX_TRANSPORT_MODE polling
            else
              set_env MAX_TRANSPORT_MODE disabled
            fi
            if [ "$MAX_OWNER_HANDLERS_ENABLED" = true ] && grep -Eq '^MAX_BOT_TOKEN=.+$' "$ROOT/.env" && grep -Eq '^MAX_OWNER_USER_IDS=.+$' "$ROOT/.env"; then
              set_env MAX_POLL_OBSERVE_ONLY false
            else
              set_env MAX_POLL_OBSERVE_ONLY true
            fi
            set_env MAX_POLL_TIMEOUT_SECONDS 20
            set_env MAX_POLL_RETRY_SECONDS 5
            set_env MAX_POLL_IDLE_SECONDS 1
            set_env MAX_POLL_MAX_STALE_SECONDS 90
            set_env PILOT_USER_LIMIT "$PILOT_USER_LIMIT"
            if [ "$PILOT_USER_LIMIT" != 0 ] && ! grep -Eq '^MAX_PILOT_USER_IDS=.+$' "$ROOT/.env"; then
              echo "Pilot limit requires MAX_PILOT_USER_IDS" >&2
              exit 1
            fi
            ensure_env MAX_MEDIA_HOST_SUFFIXES .max.ru,.oneme.ru,.okcdn.ru
            set_env PROCESSING_MODE_ROUTER_ENABLED false
            set_env REAL_BACKGROUND_COMPOSITE_ENABLED false
            set_env ALLOW_AI_BACKGROUND_FALLBACK false
            set_env BACKGROUND_ASSET_CATALOG assets/backgrounds/catalog.json
            set_env SEGMENTATION_BACKEND disabled
            set_env SEGMENTATION_MODEL u2net_human_seg
            set_env SEGMENTATION_MODEL_DIR data/models/rembg
            set_env LOCAL_AI_FINISHING_ENABLED false
            set_env BACKUP_DIR data/backups
            set_env BACKUP_RETENTION_DAYS 14
            set_env BACKUP_MAX_AGE_HOURS 30
            set_env CLEANUP_TEMP_RETENTION_HOURS 24
            set_env CLEANUP_ORPHAN_GRACE_HOURS 24
            set_env DISK_MIN_FREE_MB 2048
            chmod +x "$ROOT"/scripts/*.sh
            cd "$ROOT"
            "$ROOT"/venv/bin/pip install -r "$ROOT"/requirements.txt
            "$ROOT"/venv/bin/python --version
            "$ROOT"/venv/bin/pip check
            "$ROOT"/venv/bin/python -c 'from app.config import load_settings; from app.database import Database; Database(load_settings().database_path)'
            MAX_TRANSPORT_MODE=disabled "$ROOT"/venv/bin/python -m unittest discover -v
            "$ROOT"/venv/bin/python "$ROOT/scripts/check_asset_licenses.py"
            "$ROOT"/venv/bin/python "$ROOT/scripts/benchmark_processing.py" --iterations 3 --size 1024
            MAX_TRANSPORT_MODE=disabled "$ROOT"/scripts/healthcheck.sh
            test "$(stat -c '%a' "$ROOT/.env")" = "600"
            test "$(stat -c '%U:%G' "$ROOT/.env")" = "photoapp:photoapp"
            for dir in "$ROOT/data" "$ROOT/logs" "$ROOT/temp"; do
              test -d "$dir"
              test -w "$dir"
            done
            if [ -d "$ROOT/data/users" ]; then
              test "$(stat -c '%a' "$ROOT/data/users")" = "700"
            fi
            if [ -f "$ROOT/data/photo_bot.sqlite3" ]; then
              test "$(stat -c '%a' "$ROOT/data/photo_bot.sqlite3")" = "600"
            fi
            if [ -f "$ROOT/logs/app.log" ]; then
              chmod 600 "$ROOT/logs/app.log"
              test "$(stat -c '%a' "$ROOT/logs/app.log")" = "600"
            fi
            for path in app tests scripts docs ops requirements.txt README.md AI_REPOSITORY_CONTEXT.md; do
              test -e "$ROOT/$path"
            done
            if grep -Eq '^OPENAI_API_KEY=.+$' "$ROOT/.env"; then
              "$ROOT"/venv/bin/python -m app.main openai-check
            else
              echo "OPENAI_API_KEY is not configured; external API check skipped"
            fi
            MODE=$(sed -n 's/^MAX_TRANSPORT_MODE=//p' "$ROOT/.env" | tail -n 1)
            if [ "$MODE" = polling ] && grep -Eq '^MAX_BOT_TOKEN=.+$' "$ROOT/.env"; then
              "$ROOT"/venv/bin/python -m app.main max-check
              sudo -n install -o root -g root -m 644 \
                "$ROOT/ops/photo-bot.service" /etc/systemd/system/photo-bot.service
              sudo -n systemctl daemon-reload
              sudo -n systemctl enable photo-bot.service
              sudo -n systemctl restart photo-bot.service
              READY=0
              for attempt in $(seq 1 24); do
                if "$ROOT"/scripts/healthcheck.sh; then
                  READY=1
                  break
                fi
                sleep 3
              done
              test "$READY" = 1
              MAIN_PID=$(systemctl show photo-bot.service --property=MainPID --value)
              test "$MAIN_PID" -gt 0
              test "$(ps -o user= -p "$MAIN_PID" | xargs)" = photoapp
              tr '\0' ' ' < "/proc/$MAIN_PID/cmdline" | grep -F -- '-m app.main run' >/dev/null
              test "$(pgrep -u photoapp -f '^/opt/photo-bot/venv/bin/python -m app.main run$' | wc -l)" -eq 1

              DUPLICATE_LOG="$ROOT/temp/duplicate-polling-check.log"
              set +e
              timeout 10 "$ROOT"/venv/bin/python -m app.main run >"$DUPLICATE_LOG" 2>&1
              DUPLICATE_EXIT=$?
              set -e
              test "$DUPLICATE_EXIT" -eq 3
              grep -F 'duplicate_polling_instance' "$DUPLICATE_LOG" >/dev/null
              rm -f "$DUPLICATE_LOG"

              OLD_PID="$MAIN_PID"
              sudo -n systemctl restart photo-bot.service
              RESTARTED=0
              for attempt in $(seq 1 24); do
                NEW_PID=$(systemctl show photo-bot.service --property=MainPID --value)
                if [ "$NEW_PID" -gt 0 ] && [ "$NEW_PID" != "$OLD_PID" ] && "$ROOT"/scripts/healthcheck.sh; then
                  RESTARTED=1
                  break
                fi
                sleep 3
              done
              test "$RESTARTED" = 1
              ! kill -0 "$OLD_PID" 2>/dev/null
            else
              rm -f "$ROOT/data/photo-bot.pid"
              if systemctl cat photo-bot.service >/dev/null 2>&1; then
                sudo -n systemctl disable --now photo-bot.service
              fi
              echo "MAX runtime not started (mode=$MODE)"
            fi
            "$ROOT"/venv/bin/python -m scripts.check_runtime_secrets
            "$ROOT"/venv/bin/python - <<'PY'
          import json
          import os
          import sqlite3
          import time
          from app.config import load_settings

          settings = load_settings()
          connection = sqlite3.connect(settings.database_path)
          try:
              quick_check = connection.execute("PRAGMA quick_check").fetchone()[0]
              migration_v6 = bool(connection.execute(
                  "SELECT 1 FROM schema_migrations WHERE version=6"
              ).fetchone())
          finally:
              connection.close()
          assert quick_check == "ok"
          assert migration_v6
          stale_processing_orphans = 0
          cutoff = time.time() - 3600
          for path in settings.temp_dir.iterdir():
              if not path.name.startswith(("pixora-mask-", "pixora-composite-")):
                  continue
              if path.is_symlink() or path.stat().st_mtime > cutoff:
                  continue
              stale_processing_orphans += 1
          assert stale_processing_orphans == 0
          memory_total_mb = 0
          try:
              for line in open("/proc/meminfo", encoding="utf-8"):
                  if line.startswith("MemTotal:"):
                      memory_total_mb = int(line.split()[1]) // 1024
                      break
          except OSError:
              pass
          print("runtime_audit=" + json.dumps({
              "model": settings.openai_image_model,
              "endpoint": "/v1/images/edits",
              "quality": settings.image_edit_quality,
              "size": settings.image_edit_size,
              "input_fidelity_config": settings.image_edit_input_fidelity,
              "input_fidelity_sent": (
                  not settings.openai_image_model.startswith("gpt-image-2")
                  and settings.image_edit_input_fidelity != "auto"
              ),
              "output_format": settings.image_edit_output_format,
              "timeout_seconds": settings.generation_timeout_seconds,
              "max_retries": settings.openai_max_retries,
              "transport": settings.max_transport_mode,
              "observe_only": settings.max_poll_observe_only,
              "owner_allowlist_configured": bool(settings.max_owner_user_ids),
              "processing_mode_router_enabled": settings.processing_mode_router_enabled,
              "real_background_composite_enabled": settings.real_background_composite_enabled,
              "segmentation_backend": settings.segmentation_backend,
              "local_ai_finishing_enabled": settings.local_ai_finishing_enabled,
              "cpu_count": os.cpu_count(),
              "memory_total_mb": memory_total_mb,
              "stale_processing_orphans": stale_processing_orphans,
              "sqlite_quick_check": quick_check,
              "migration_v6": migration_v6,
          }, sort_keys=True))
          PY
            "$ROOT"/venv/bin/python -m app.main launch-status
            printf '%s\n' "$DEPLOY_SHA" > "$ROOT/data/deployed_commit.txt.tmp"
            mv "$ROOT/data/deployed_commit.txt.tmp" "$ROOT/data/deployed_commit.txt"
            test "$(cat "$ROOT/data/deployed_commit.txt")" = "$DEPLOY_SHA"
            printf 'deployed_commit=%s\n' "$DEPLOY_SHA"
          REMOTE
      - name: Reset owner dialog to a clean main-menu state
        if: >-
          env.DEPLOY_CONFIGURED == 'true' && github.event_name == 'workflow_dispatch' &&
          inputs.reset_owner_dialog == true
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            cd /opt/photo-bot
            venv/bin/python - <<'PY'
          from app.config import load_settings
          from app.database import Database
          from app.max_conversation import MaxConversationStore

          settings = load_settings()
          store = MaxConversationStore(Database(settings.database_path))
          reset_count = 0
          for owner_id in settings.max_owner_user_ids:
              if store.get(owner_id) is None:
                  continue
              store.transition(
                  owner_id,
                  "main_menu",
                  event_key="ops:owner-dialog-reset",
                  force=True,
                  selected_scenario_id=None,
                  session_id=None,
                  pending_prompt=None,
                  pending_action=None,
                  current_gallery_item_id=None,
                  current_version_id=None,
                  gallery_cursor=0,
                  status_message_id=None,
              )
              reset_count += 1
          if reset_count == 0:
              raise SystemExit("No allowlisted owner dialog was available to reset")
          print(f"owner_dialogs_reset={reset_count}")
          PY
          REMOTE
      - name: Grant bounded owner E2E attempts
        if: >-
          env.DEPLOY_CONFIGURED == 'true' && github.event_name == 'workflow_dispatch' &&
          inputs.grant_owner_e2e_attempts == '5'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            cd /opt/photo-bot
            venv/bin/python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          from app.config import load_settings
          from app.database import Database

          def iso(value: datetime) -> str:
              return value.isoformat()

          settings = load_settings()
          database = Database(settings.database_path)
          now = datetime.now(timezone.utc)
          expires = now + timedelta(minutes=settings.demo_session_ttl_minutes)
          granted_count = 0
          with database.transaction() as connection:
              for owner_id in settings.max_owner_user_ids:
                  row = connection.execute(
                      """SELECT s.id,s.source_file_path,s.successful_generations,
                                s.max_generations,s.status
                         FROM demo_sessions s
                         JOIN users u ON u.id=s.user_id
                         WHERE u.platform='max' AND u.platform_user_id=?""",
                      (owner_id,),
                  ).fetchone()
                  if (
                      row is None
                      or row["status"] == "deleted"
                      or row["successful_generations"] < row["max_generations"]
                      or not Path(row["source_file_path"]).is_file()
                  ):
                      continue
                  connection.execute(
                      """UPDATE demo_sessions
                         SET max_generations=successful_generations+5,
                             status='active',expires_at=?,updated_at=?
                         WHERE id=?""",
                      (iso(expires), iso(now), row["id"]),
                  )
                  granted_count += 1
          if granted_count == 0:
              raise SystemExit("No allowlisted owner session with a valid source was available")
          print(f"owner_e2e_sessions_granted={granted_count}")
          print("owner_e2e_attempts_granted=5")
          PY
          REMOTE
