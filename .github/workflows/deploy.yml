name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_owner_handlers:
        description: Temporarily enable owner-only MAX application handlers
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: photo-bot-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    env:
      OPENAI_KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
      MAX_KEY_CONFIGURED: ${{ secrets.MAX_BOT_TOKEN != '' }}
      MAX_OWNER_CONFIGURED: ${{ secrets.MAX_OWNER_USER_ID != '' }}
      MAX_OWNER_HANDLERS_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_owner_handlers == true }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Scan tracked files for secrets
        run: python scripts/scan_secrets.py
      - name: Run unit tests and healthcheck
        env:
          APP_ENV: ci
          BASE_DIR: ${{ github.workspace }}
        run: |
          python -m unittest discover -v
          python -m app.main health
      - name: Validate OpenAI credential from GitHub runner
        if: env.OPENAI_KEY_CONFIGURED == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
          APP_ENV: ci
        run: python -m app.main openai-check
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_CONFIGURED: ${{ secrets.HETZNER_HOST != '' && secrets.HETZNER_USER != '' && secrets.HETZNER_SSH_PRIVATE_KEY != '' && secrets.HETZNER_SSH_PORT != '' }}
      OPENAI_KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
      MAX_KEY_CONFIGURED: ${{ secrets.MAX_BOT_TOKEN != '' }}
      MAX_OWNER_CONFIGURED: ${{ secrets.MAX_OWNER_USER_ID != '' }}
    steps:
      - name: Require Hetzner deployment configuration
        if: env.DEPLOY_CONFIGURED != 'true'
        run: |
          echo "Hetzner production secrets are incomplete." >&2
          exit 1
      - uses: actions/checkout@v7
        if: env.DEPLOY_CONFIGURED == 'true'
      - name: Configure SSH
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Synchronize application files
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" '
            if systemctl cat photo-bot.service >/dev/null 2>&1; then
              sudo -n systemctl stop photo-bot.service
            fi
            if [ -f /opt/photo-bot/data/photo-bot.pid ]; then
              /opt/photo-bot/scripts/stop_bot.sh
            fi'
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='venv/' \
            --exclude='data/' \
            --exclude='logs/' \
            --exclude='temp/' \
            --exclude='site/' \
            -e "ssh -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:/opt/photo-bot/"
      - name: Configure OpenAI credential
        if: env.DEPLOY_CONFIGURED == 'true' && env.OPENAI_KEY_CONFIGURED == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          printf '%s' "$OPENAI_API_KEY" | \
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -e
            ROOT=/opt/photo-bot
            KEY=$(cat)
            test -n "$KEY"
            TMP="$ROOT/.env.tmp"
            grep -v "^OPENAI_API_KEY=" "$ROOT/.env" > "$TMP" || true
            printf "%s\n" "OPENAI_API_KEY=$KEY" >> "$TMP"
            chmod 600 "$TMP"
            mv "$TMP" "$ROOT/.env"
            unset KEY'
      - name: Configure MAX credential
        if: env.DEPLOY_CONFIGURED == 'true' && env.MAX_KEY_CONFIGURED == 'true'
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          printf '%s' "$MAX_BOT_TOKEN" | \
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -e
            ROOT=/opt/photo-bot
            KEY=$(cat)
            test -n "$KEY"
            TMP="$ROOT/.env.tmp"
            grep -v "^MAX_BOT_TOKEN=" "$ROOT/.env" > "$TMP" || true
            printf "%s\n" "MAX_BOT_TOKEN=$KEY" >> "$TMP"
            chmod 600 "$TMP"
            mv "$TMP" "$ROOT/.env"
            unset KEY'
      - name: Configure MAX owner allowlist
        if: env.DEPLOY_CONFIGURED == 'true' && env.MAX_OWNER_CONFIGURED == 'true'
        env:
          MAX_OWNER_USER_ID: ${{ secrets.MAX_OWNER_USER_ID }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          printf '%s' "$MAX_OWNER_USER_ID" | \
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -e
            ROOT=/opt/photo-bot
            OWNER_ID=$(cat)
            test -n "$OWNER_ID"
            TMP="$ROOT/.env.tmp"
            grep -v "^MAX_OWNER_USER_IDS=" "$ROOT/.env" > "$TMP" || true
            printf "%s\n" "MAX_OWNER_USER_IDS=$OWNER_ID" >> "$TMP"
            chmod 600 "$TMP"
            mv "$TMP" "$ROOT/.env"
            unset OWNER_ID'
      - name: Disable MAX handlers without owner secret
        if: env.DEPLOY_CONFIGURED == 'true' && env.MAX_OWNER_CONFIGURED != 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -e
            ROOT=/opt/photo-bot
            TMP="$ROOT/.env.tmp"
            grep -v "^MAX_OWNER_USER_IDS=" "$ROOT/.env" > "$TMP" || true
            printf "%s\n" "MAX_OWNER_USER_IDS=" >> "$TMP"
            chmod 600 "$TMP"
            mv "$TMP" "$ROOT/.env"'
      - name: Install and verify production
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          MAX_OWNER_HANDLERS_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_owner_handlers == true }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' -- "$GITHUB_SHA" "$MAX_OWNER_HANDLERS_ENABLED" <<'REMOTE'
            set -euo pipefail
            ROOT=/opt/photo-bot
            DEPLOY_SHA="$1"
            MAX_OWNER_HANDLERS_ENABLED="${2:-false}"
            test "$(id -un)" = "photoapp"
            test "$(stat -c '%U:%G' "$ROOT")" = "photoapp:photoapp"
            mkdir -p "$ROOT/data" "$ROOT/logs" "$ROOT/temp"
            if [ ! -f "$ROOT/.env" ]; then
              install -m 600 /dev/null "$ROOT/.env"
            else
              chmod 600 "$ROOT/.env"
            fi
            grep -q '^OPENAI_IMAGE_MODEL=' "$ROOT/.env" || printf '%s\n' 'OPENAI_IMAGE_MODEL=gpt-image-2' >> "$ROOT/.env"
            grep -q '^APP_ENV=' "$ROOT/.env" || printf '%s\n' 'APP_ENV=production' >> "$ROOT/.env"
            grep -q '^BASE_DIR=' "$ROOT/.env" || printf '%s\n' 'BASE_DIR=/opt/photo-bot' >> "$ROOT/.env"
            ensure_env() { grep -q "^$1=" "$ROOT/.env" || printf '%s=%s\n' "$1" "$2" >> "$ROOT/.env"; }
            ensure_env DEMO_MAX_SUCCESSFUL_GENERATIONS 5
            ensure_env DEMO_SESSION_TTL_MINUTES 60
            ensure_env DEMO_WATERMARK_TEXT ОБРАЗЕЦ
            ensure_env DEMO_MAX_DIMENSION 1024
            ensure_env DEMO_OUTPUT_FORMAT JPEG
            ensure_env DEMO_JPEG_QUALITY 82
            ensure_env DEMO_MIN_REQUEST_INTERVAL_SECONDS 15
            ensure_env DEMO_MAX_ATTEMPTS_PER_HOUR 10
            ensure_env DEMO_MAX_CONCURRENT_PER_USER 1
            ensure_env GLOBAL_MAX_CONCURRENT_GENERATIONS 2
            ensure_env DEMO_DAILY_COST_LIMIT_RUB 1000
            ensure_env DEMO_DAILY_GENERATION_LIMIT 100
            ensure_env DEMO_ESTIMATED_COST_RUB_PER_GENERATION 10
            ensure_env MAX_SOURCE_FILE_SIZE_MB 15
            ensure_env MAX_PROMPT_LENGTH 1500
            ensure_env GENERATION_TIMEOUT_SECONDS 300
            ensure_env UNLOCK_ORIGINAL_PRICE_RUB 149
            ensure_env DEMO_RETENTION_DAYS 30
            ensure_env PAID_RETENTION_DAYS 180
            ensure_env TRASH_RETENTION_DAYS 30
            ensure_env MAX_BOT_TOKEN ''
            ensure_env MAX_OWNER_USER_IDS ''
            ensure_env MAX_API_BASE_URL https://platform-api2.max.ru
            ensure_env MAX_CA_BUNDLE ops/certs/russian_trusted_root_ca_pem.crt
            set_env() {
              NAME="$1"
              VALUE="$2"
              TMP="$ROOT/.env.runtime.tmp"
              grep -v "^$NAME=" "$ROOT/.env" > "$TMP" || true
              printf '%s=%s\n' "$NAME" "$VALUE" >> "$TMP"
              chmod 600 "$TMP"
              mv "$TMP" "$ROOT/.env"
            }
            if grep -Eq '^MAX_BOT_TOKEN=.+$' "$ROOT/.env"; then
              set_env MAX_TRANSPORT_MODE polling
            else
              set_env MAX_TRANSPORT_MODE disabled
            fi
            if [ "$MAX_OWNER_HANDLERS_ENABLED" = true ] && grep -Eq '^MAX_BOT_TOKEN=.+$' "$ROOT/.env" && grep -Eq '^MAX_OWNER_USER_IDS=.+$' "$ROOT/.env"; then
              set_env MAX_POLL_OBSERVE_ONLY false
            else
              set_env MAX_POLL_OBSERVE_ONLY true
            fi
            set_env MAX_POLL_TIMEOUT_SECONDS 20
            set_env MAX_POLL_RETRY_SECONDS 5
            set_env MAX_POLL_IDLE_SECONDS 1
            set_env MAX_POLL_MAX_STALE_SECONDS 90
            ensure_env MAX_MEDIA_HOST_SUFFIXES .max.ru,.oneme.ru,.okcdn.ru
            chmod +x "$ROOT"/scripts/*.sh
            cd "$ROOT"
            "$ROOT"/venv/bin/pip install -r "$ROOT"/requirements.txt
            "$ROOT"/venv/bin/python --version
            "$ROOT"/venv/bin/pip check
            "$ROOT"/venv/bin/python -c 'from app.config import load_settings; from app.database import Database; Database(load_settings().database_path)'
            MAX_TRANSPORT_MODE=disabled "$ROOT"/venv/bin/python -m unittest discover -v
            MAX_TRANSPORT_MODE=disabled "$ROOT"/scripts/healthcheck.sh
            test "$(stat -c '%a' "$ROOT/.env")" = "600"
            test "$(stat -c '%U:%G' "$ROOT/.env")" = "photoapp:photoapp"
            for dir in "$ROOT/data" "$ROOT/logs" "$ROOT/temp"; do
              test -d "$dir"
              test -w "$dir"
            done
            if [ -d "$ROOT/data/users" ]; then
              test "$(stat -c '%a' "$ROOT/data/users")" = "700"
            fi
            if [ -f "$ROOT/data/photo_bot.sqlite3" ]; then
              test "$(stat -c '%a' "$ROOT/data/photo_bot.sqlite3")" = "600"
            fi
            if [ -f "$ROOT/logs/app.log" ]; then
              chmod 600 "$ROOT/logs/app.log"
              test "$(stat -c '%a' "$ROOT/logs/app.log")" = "600"
            fi
            for path in app tests scripts docs ops requirements.txt README.md AI_REPOSITORY_CONTEXT.md; do
              test -e "$ROOT/$path"
            done
            if grep -Eq '^OPENAI_API_KEY=.+$' "$ROOT/.env"; then
              "$ROOT"/venv/bin/python -m app.main openai-check
            else
              echo "OPENAI_API_KEY is not configured; external API check skipped"
            fi
            MODE=$(sed -n 's/^MAX_TRANSPORT_MODE=//p' "$ROOT/.env" | tail -n 1)
            if [ "$MODE" = polling ] && grep -Eq '^MAX_BOT_TOKEN=.+$' "$ROOT/.env"; then
              "$ROOT"/venv/bin/python -m app.main max-check
              sudo -n install -o root -g root -m 644 \
                "$ROOT/ops/photo-bot.service" /etc/systemd/system/photo-bot.service
              sudo -n systemctl daemon-reload
              sudo -n systemctl enable photo-bot.service
              sudo -n systemctl restart photo-bot.service
              READY=0
              for attempt in $(seq 1 24); do
                if "$ROOT"/scripts/healthcheck.sh; then
                  READY=1
                  break
                fi
                sleep 3
              done
              test "$READY" = 1
              MAIN_PID=$(systemctl show photo-bot.service --property=MainPID --value)
              test "$MAIN_PID" -gt 0
              test "$(ps -o user= -p "$MAIN_PID" | xargs)" = photoapp
              tr '\0' ' ' < "/proc/$MAIN_PID/cmdline" | grep -F -- '-m app.main run' >/dev/null
              test "$(pgrep -u photoapp -f '^/opt/photo-bot/venv/bin/python -m app.main run$' | wc -l)" -eq 1

              DUPLICATE_LOG="$ROOT/temp/duplicate-polling-check.log"
              set +e
              timeout 10 "$ROOT"/venv/bin/python -m app.main run >"$DUPLICATE_LOG" 2>&1
              DUPLICATE_EXIT=$?
              set -e
              test "$DUPLICATE_EXIT" -eq 3
              grep -F 'duplicate_polling_instance' "$DUPLICATE_LOG" >/dev/null
              rm -f "$DUPLICATE_LOG"

              OLD_PID="$MAIN_PID"
              sudo -n systemctl restart photo-bot.service
              RESTARTED=0
              for attempt in $(seq 1 24); do
                NEW_PID=$(systemctl show photo-bot.service --property=MainPID --value)
                if [ "$NEW_PID" -gt 0 ] && [ "$NEW_PID" != "$OLD_PID" ] && "$ROOT"/scripts/healthcheck.sh; then
                  RESTARTED=1
                  break
                fi
                sleep 3
              done
              test "$RESTARTED" = 1
              ! kill -0 "$OLD_PID" 2>/dev/null
            else
              rm -f "$ROOT/data/photo-bot.pid"
              if systemctl cat photo-bot.service >/dev/null 2>&1; then
                sudo -n systemctl disable --now photo-bot.service
              fi
              echo "MAX runtime not started (mode=$MODE)"
            fi
            "$ROOT"/venv/bin/python -m scripts.check_runtime_secrets
            printf '%s\n' "$DEPLOY_SHA" > "$ROOT/data/deployed_commit.txt.tmp"
            mv "$ROOT/data/deployed_commit.txt.tmp" "$ROOT/data/deployed_commit.txt"
          REMOTE
      - name: Audit owner E2E runtime without sensitive identifiers
        if: github.event_name == 'workflow_dispatch' && inputs.enable_owner_handlers == true
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            cd /opt/photo-bot
            venv/bin/python - <<'PY'
          from app.config import load_settings
          from app.database import Database

          settings = load_settings()
          print(f"observe_only={str(settings.max_poll_observe_only).lower()}")
          print(f"owner_allowlist_configured={str(bool(settings.max_owner_user_ids)).lower()}")
          with Database(settings.database_path).read() as connection:
              checks = {
                  "processed_events": "SELECT COUNT(*) FROM max_processed_events",
                  "dialogs": "SELECT COUNT(*) FROM max_dialogs",
                  "transitions": "SELECT COUNT(*) FROM max_dialog_transitions",
              }
              for label, query in checks.items():
                  print(f"{label}={connection.execute(query).fetchone()[0]}")
              for row in connection.execute(
                  "SELECT event_type,status,updated_at FROM max_processed_events ORDER BY updated_at DESC LIMIT 10"
              ):
                  print(f"event={row['event_type']} status={row['status']} at={row['updated_at']}")
              for row in connection.execute(
                  "SELECT state,COUNT(*) AS total FROM max_dialogs GROUP BY state ORDER BY state"
              ):
                  print(f"dialog_state={row['state']} count={row['total']}")
              state = connection.execute(
                  "SELECT updated_at FROM max_transport_state WHERE name='poll_last_success'"
              ).fetchone()
              print(f"poll_last_success={state['updated_at'] if state else 'missing'}")
          PY
            tail -n 120 logs/app.log | sed -E \
              -e 's/sk-[A-Za-z0-9_-]+/[REDACTED]/g' \
              -e 's/(user_id|platform_user_id|chat_id)=[^, )]+/\1=[REDACTED]/g'
          REMOTE
