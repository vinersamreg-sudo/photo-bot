name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      activate_gemini:
        description: Apply the approved Gemini Nano Banana Pro production flags
        required: false
        type: boolean
        default: false
      enable_owner_handlers:
        description: Temporarily enable owner-only MAX application handlers
        required: false
        type: boolean
        default: false
      reset_owner_dialog:
        description: Reset allowlisted owner dialog bindings after deployment
        required: false
        type: boolean
        default: false
      grant_owner_e2e_attempts:
        description: Add a bounded number of attempts to the existing owner demo session
        required: false
        type: choice
        options: ['0', '5']
        default: '0'
      pilot_user_limit:
        description: Number of explicitly allowlisted closed-pilot users
        required: false
        type: choice
        options: ['0', '5', '10', '20']
        default: '0'

permissions:
  contents: read

concurrency:
  group: photo-bot-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    env:
      OPENAI_KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
      GEMINI_KEY_CONFIGURED: ${{ secrets.GEMINI_API_KEY != '' }}
      MAX_KEY_CONFIGURED: ${{ secrets.MAX_BOT_TOKEN != '' }}
      MAX_OWNER_CONFIGURED: ${{ secrets.MAX_OWNER_USER_ID != '' }}
      ROBOKASSA_PRODUCTION_CONFIGURED: ${{ secrets.ROBOKASSA_MERCHANT_LOGIN != '' && secrets.ROBOKASSA_PASSWORD_1 != '' && secrets.ROBOKASSA_PASSWORD_2 != '' }}
      MAX_PILOT_CONFIGURED: ${{ secrets.MAX_PILOT_USER_IDS != '' }}
      MAX_OWNER_HANDLERS_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_owner_handlers == true }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Validate closed-pilot rollout configuration
        if: github.event_name == 'workflow_dispatch' && inputs.pilot_user_limit != '0'
        env:
          PILOT_USER_LIMIT: ${{ inputs.pilot_user_limit }}
          MAX_PILOT_USER_IDS: ${{ secrets.MAX_PILOT_USER_IDS }}
          MAX_OWNER_USER_ID: ${{ secrets.MAX_OWNER_USER_ID }}
        run: |
          python - <<'PY'
          import os

          limit = int(os.environ["PILOT_USER_LIMIT"])
          pilots = tuple(dict.fromkeys(
              value.strip()
              for value in os.environ.get("MAX_PILOT_USER_IDS", "").split(",")
              if value.strip()
          ))
          owner = os.environ.get("MAX_OWNER_USER_ID", "").strip()
          if len(pilots) < limit:
              raise SystemExit("Pilot allowlist is shorter than the requested rollout stage")
          if owner and owner in pilots:
              raise SystemExit("Pilot allowlist must not contain the owner")
          print(f"pilot_rollout_validated={limit}")
          PY
      - name: Scan tracked files for secrets
        run: |
          python scripts/scan_secrets.py
          python scripts/check_asset_licenses.py
      - name: Validate Ravuna nginx candidate with nginx
        run: |
          CERT_DIR="$RUNNER_TEMP/ravuna-nginx-cert"
          install -d "$CERT_DIR"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$CERT_DIR/privkey.pem" \
            -out "$CERT_DIR/fullchain.pem" \
            -subj '/CN=ravuna.ru' >/dev/null 2>&1
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/site/nginx/ravuna.ru.conf:/etc/nginx/conf.d/ravuna.conf:ro" \
            --volume "$CERT_DIR:/etc/letsencrypt/live/ravuna.ru:ro" \
            nginx:1.27-alpine nginx -t
      - name: Run fast pull-request profiles
        if: github.event_name == 'pull_request'
        env:
          APP_ENV: ci
          BASE_DIR: ${{ github.workspace }}
        run: |
          python scripts/test_fast.py max
          python scripts/test_fast.py payments
          python scripts/test_fast.py openai
          python scripts/test_fast.py storage
          python scripts/test_fast.py site
      - name: Run full tests and healthcheck
        if: github.event_name != 'pull_request'
        env:
          APP_ENV: ci
          BASE_DIR: ${{ github.workspace }}
        run: |
          python -m unittest discover -v
          python -m app.main health
      - name: Confirm OpenAI credential is configured without an API request
        if: env.OPENAI_KEY_CONFIGURED == 'true'
        run: echo "OpenAI credential is configured; external validation is intentionally skipped."
      - name: Confirm Gemini credential is configured without an API request
        if: env.GEMINI_KEY_CONFIGURED == 'true'
        run: echo "Gemini credential is configured; external validation is intentionally skipped."
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_CONFIGURED: ${{ secrets.HETZNER_HOST != '' && secrets.HETZNER_USER != '' && secrets.HETZNER_SSH_PRIVATE_KEY != '' && secrets.HETZNER_SSH_PORT != '' }}
      OPENAI_KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
      GEMINI_KEY_CONFIGURED: ${{ secrets.GEMINI_API_KEY != '' }}
      MAX_KEY_CONFIGURED: ${{ secrets.MAX_BOT_TOKEN != '' }}
      MAX_OWNER_CONFIGURED: ${{ secrets.MAX_OWNER_USER_ID != '' }}
      ROBOKASSA_PRODUCTION_CONFIGURED: ${{ secrets.ROBOKASSA_MERCHANT_LOGIN != '' && secrets.ROBOKASSA_PASSWORD_1 != '' && secrets.ROBOKASSA_PASSWORD_2 != '' }}
    steps:
      - name: Require Hetzner deployment configuration
        if: env.DEPLOY_CONFIGURED != 'true'
        run: |
          echo "Hetzner production secrets are incomplete." >&2
          exit 1
      - name: Require Gemini credential for activation
        if: inputs.activate_gemini == true && env.GEMINI_KEY_CONFIGURED != 'true'
        run: |
          echo "Gemini production credential is not configured." >&2
          exit 1
      - uses: actions/checkout@v7
        if: env.DEPLOY_CONFIGURED == 'true'
      - name: Configure SSH
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Capture pre-deploy production snapshot
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          install -d artifact
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE' | tee artifact/pre-deploy-status.txt
            set -euo pipefail
            cd /opt/photo-bot
            venv/bin/python scripts/production_status.py --root /opt/photo-bot
            venv/bin/python - <<'PY'
          from pathlib import Path

          allowed = (
              "IMAGE_PROVIDER",
              "GEMINI_IMAGE_MODEL",
              "IMAGE_DIRECT_PROMPT_ENABLED",
              "IMAGE_SUBJECT_PRESERVE_GUARD_ENABLED",
              "IMAGE_FACE_PRESERVE_GUARD_ENABLED",
              "MAX_SINGLE_SCREEN_UI_ENABLED",
          )
          values = {}
          for line in Path("/opt/photo-bot/.env").read_text(encoding="utf-8").splitlines():
              if "=" not in line or line.lstrip().startswith("#"):
                  continue
              key, value = line.split("=", 1)
              values[key.strip()] = value.strip()
          for key in allowed:
              print(f"PRE_{key}={values.get(key, 'missing')}")
          print("PRE_GEMINI_API_KEY_CONFIGURED=" + ("yes" if values.get("GEMINI_API_KEY") else "no"))
          PY
          REMOTE
      - name: Store pre-deploy production snapshot
        if: env.DEPLOY_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-status-${{ github.run_id }}
          path: artifact/pre-deploy-status.txt
          if-no-files-found: error
          retention-days: 14
      - name: Require preinstalled Ravuna payment routes
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            HEADERS=$(mktemp /tmp/ravuna-payment-preflight.XXXXXX)
            trap 'rm -f "$HEADERS"' EXIT
            STATUS=$(curl --silent --show-error --output /dev/null --dump-header "$HEADERS" \
              --write-out '%{http_code}' --resolve ravuna.ru:443:127.0.0.1 \
              https://ravuna.ru/p/00000000000000000000000000000000)
            test "$STATUS" = 404
            grep -Fi 'X-Ravuna-Payment-Route: active' "$HEADERS" >/dev/null
            printf 'ravuna_payment_route_preflight=%s\n' "$STATUS"
          REMOTE
      - name: Require idle production before deployment
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            if [ -f /opt/photo-bot/data/photo_bot.sqlite3 ] && [ -x /opt/photo-bot/venv/bin/python ]; then
              /opt/photo-bot/venv/bin/python - <<'PY'
          import sqlite3

          connection = sqlite3.connect("/opt/photo-bot/data/photo_bot.sqlite3")
          try:
              active = connection.execute(
                  """SELECT
                         (SELECT COUNT(*) FROM generation_attempts
                          WHERE status IN ('pending','processing')) +
                         (SELECT COUNT(*) FROM max_dialogs WHERE state='processing')"""
              ).fetchone()[0]
          finally:
              connection.close()
          if active:
              raise SystemExit("Deployment paused: active processing is present")
          print("active_processing=0")
          PY
            fi
          REMOTE
      - name: Synchronize application files
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            if systemctl cat photo-bot.service >/dev/null 2>&1; then
              sudo -n systemctl stop photo-bot.service
            fi
            if [ -f /opt/photo-bot/data/photo-bot.pid ]; then
              /opt/photo-bot/scripts/stop_bot.sh
            fi
            if [ -f /opt/photo-bot/data/photo_bot.sqlite3 ]; then
              install -m 700 -d /opt/photo-bot/data/backups
              BACKUP_FILE="/opt/photo-bot/data/backups/pre-migration-$(date -u +%Y%m%dT%H%M%SZ).sqlite3"
              /opt/photo-bot/venv/bin/python - "$BACKUP_FILE" <<'PY'
          import sqlite3
          import sys

          source = sqlite3.connect("/opt/photo-bot/data/photo_bot.sqlite3")
          backup = sqlite3.connect(sys.argv[1])
          try:
              source.backup(backup)
              result = backup.execute("PRAGMA quick_check").fetchone()
              if not result or result[0] != "ok":
                  raise SystemExit("pre-migration SQLite backup failed quick_check")
          finally:
              backup.close()
              source.close()
          print("sqlite_backup=created")
          PY
              chmod 600 "$BACKUP_FILE"
            fi
          REMOTE
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='venv/' \
            --exclude='data/' \
            --exclude='logs/' \
            --exclude='temp/' \
            --include='/site/' \
            --include='/site/nginx/' \
            --include='/site/nginx/ravuna.ru.conf' \
            --exclude='/site/***' \
            -e "ssh -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:/opt/photo-bot/"
      - name: Configure OpenAI credential
        if: env.DEPLOY_CONFIGURED == 'true' && env.OPENAI_KEY_CONFIGURED == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          printf '%s' "$OPENAI_API_KEY" | \
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -e
            ROOT=/opt/photo-bot
            KEY=$(cat)
            test -n "$KEY"
            TMP="$ROOT/.env.tmp"
            grep -v "^OPENAI_API_KEY=" "$ROOT/.env" > "$TMP" || true
            printf "%s\n" "OPENAI_API_KEY=$KEY" >> "$TMP"
            chmod 600 "$TMP"
            mv "$TMP" "$ROOT/.env"
            unset KEY'
      - name: Configure Gemini credential
        if: env.DEPLOY_CONFIGURED == 'true' && env.GEMINI_KEY_CONFIGURED == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          printf '%s' "$GEMINI_API_KEY" | \
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -e
            ROOT=/opt/photo-bot
            KEY=$(cat)
            test -n "$KEY"
            TMP="$ROOT/.env.tmp"
            grep -v "^GEMINI_API_KEY=" "$ROOT/.env" > "$TMP" || true
            printf "%s\n" "GEMINI_API_KEY=$KEY" >> "$TMP"
            chmod 600 "$TMP"
            mv "$TMP" "$ROOT/.env"
            unset KEY'
      - name: Configure MAX credential
        if: env.DEPLOY_CONFIGURED == 'true' && env.MAX_KEY_CONFIGURED == 'true'
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          printf '%s' "$MAX_BOT_TOKEN" | \
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -e
            ROOT=/opt/photo-bot
            KEY=$(cat)
            test -n "$KEY"
            TMP="$ROOT/.env.tmp"
            grep -v "^MAX_BOT_TOKEN=" "$ROOT/.env" > "$TMP" || true
            printf "%s\n" "MAX_BOT_TOKEN=$KEY" >> "$TMP"
            chmod 600 "$TMP"
            mv "$TMP" "$ROOT/.env"
            unset KEY'
      - name: Configure MAX owner allowlist
        if: env.DEPLOY_CONFIGURED == 'true' && env.MAX_OWNER_CONFIGURED == 'true'
        env:
          MAX_OWNER_USER_ID: ${{ secrets.MAX_OWNER_USER_ID }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          printf '%s' "$MAX_OWNER_USER_ID" | \
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -e
            ROOT=/opt/photo-bot
            OWNER_ID=$(cat)
            test -n "$OWNER_ID"
            TMP="$ROOT/.env.tmp"
            grep -v "^MAX_OWNER_USER_IDS=" "$ROOT/.env" > "$TMP" || true
            printf "%s\n" "MAX_OWNER_USER_IDS=$OWNER_ID" >> "$TMP"
            chmod 600 "$TMP"
            mv "$TMP" "$ROOT/.env"
            unset OWNER_ID'
      - name: Disable MAX handlers without owner secret
        if: env.DEPLOY_CONFIGURED == 'true' && env.MAX_OWNER_CONFIGURED != 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -e
            ROOT=/opt/photo-bot
            TMP="$ROOT/.env.tmp"
            grep -v "^MAX_OWNER_USER_IDS=" "$ROOT/.env" > "$TMP" || true
            printf "%s\n" "MAX_OWNER_USER_IDS=" >> "$TMP"
            chmod 600 "$TMP"
            mv "$TMP" "$ROOT/.env"'
      - name: Configure closed-pilot allowlist
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          MAX_PILOT_USER_IDS: ${{ secrets.MAX_PILOT_USER_IDS }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          printf '%s' "$MAX_PILOT_USER_IDS" | \
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -e
            ROOT=/opt/photo-bot
            PILOT_IDS=$(cat)
            TMP="$ROOT/.env.tmp"
            grep -v "^MAX_PILOT_USER_IDS=" "$ROOT/.env" > "$TMP" || true
            printf "%s\n" "MAX_PILOT_USER_IDS=$PILOT_IDS" >> "$TMP"
            chmod 600 "$TMP"
            mv "$TMP" "$ROOT/.env"
            unset PILOT_IDS'
      - name: Configure production Robokassa credentials
        if: env.DEPLOY_CONFIGURED == 'true' && env.ROBOKASSA_PRODUCTION_CONFIGURED == 'true'
        env:
          MERCHANT_LOGIN: ${{ secrets.ROBOKASSA_MERCHANT_LOGIN }}
          PASSWORD_1: ${{ secrets.ROBOKASSA_PASSWORD_1 }}
          PASSWORD_2: ${{ secrets.ROBOKASSA_PASSWORD_2 }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          {
            printf '%s\n' "$MERCHANT_LOGIN"
            printf '%s\n' "$PASSWORD_1"
            printf '%s\n' "$PASSWORD_2"
          } | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'cd /opt/photo-bot && venv/bin/python -m scripts.set_robokassa_production_secrets --env-file /opt/photo-bot/.env'
      - name: Install and verify production
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          ACTIVATE_GEMINI: ${{ github.event_name == 'workflow_dispatch' && inputs.activate_gemini == true }}
          MAX_OWNER_HANDLERS_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_owner_handlers == true }}
          PILOT_USER_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.pilot_user_limit || '0' }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' -- "$GITHUB_SHA" "$MAX_OWNER_HANDLERS_ENABLED" "$PILOT_USER_LIMIT" "$ACTIVATE_GEMINI" <<'REMOTE'
            set -euo pipefail
            ROOT=/opt/photo-bot
            DEPLOY_SHA="$1"
            MAX_OWNER_HANDLERS_ENABLED="${2:-false}"
            PILOT_USER_LIMIT="${3:-0}"
            ACTIVATE_GEMINI="${4:-false}"
            export ACTIVATE_GEMINI
            test "$(id -un)" = "photoapp"
            test "$(stat -c '%U:%G' "$ROOT")" = "photoapp:photoapp"
            mkdir -p "$ROOT/data" "$ROOT/logs" "$ROOT/temp"
            if [ ! -f "$ROOT/.env" ]; then
              install -m 600 /dev/null "$ROOT/.env"
            else
              chmod 600 "$ROOT/.env"
            fi
            ensure_env() { grep -q "^$1=" "$ROOT/.env" || printf '%s=%s\n' "$1" "$2" >> "$ROOT/.env"; }
            ensure_env DEMO_MAX_SUCCESSFUL_GENERATIONS 2
            ensure_env IMAGE_EDIT_QUALITY medium
            ensure_env IMAGE_EDIT_SIZE auto
            ensure_env IMAGE_EDIT_INPUT_FIDELITY auto
            ensure_env IMAGE_EDIT_OUTPUT_FORMAT png
            ensure_env OPENAI_MAX_RETRIES 2
            ensure_env OPENAI_BALANCE_USD ''
            ensure_env OPENAI_BALANCE_CONFIRMED_AT ''
            ensure_env OPENAI_BALANCE_WARNING_USD 5
            ensure_env OPENAI_BALANCE_CRITICAL_USD 1
            ensure_env OPENAI_BALANCE_MAX_AGE_HOURS 72
            ensure_env OPENAI_IMAGE_REQUESTS_ENABLED true
            ensure_env DEMO_SESSION_TTL_MINUTES 60
            ensure_env DEMO_WATERMARK_TEXT ОБРАЗЕЦ
            ensure_env DEMO_MAX_DIMENSION 1024
            ensure_env DEMO_OUTPUT_FORMAT JPEG
            ensure_env DEMO_JPEG_QUALITY 82
            ensure_env DEMO_MIN_REQUEST_INTERVAL_SECONDS 15
            ensure_env DEMO_MAX_ATTEMPTS_PER_HOUR 10
            ensure_env DEMO_MAX_CONCURRENT_PER_USER 1
            ensure_env GLOBAL_MAX_CONCURRENT_GENERATIONS 2
            ensure_env DEMO_DAILY_COST_LIMIT_RUB 1000
            ensure_env DEMO_DAILY_GENERATION_LIMIT 100
            ensure_env DEMO_ESTIMATED_COST_RUB_PER_GENERATION 10
            ensure_env MAX_SOURCE_FILE_SIZE_MB 15
            ensure_env MAX_PROMPT_LENGTH 1500
            ensure_env GENERATION_TIMEOUT_SECONDS 300
            ensure_env UNLOCK_ORIGINAL_PRICE_RUB 49
            ensure_env CONTINUATION_PACK_PRICE_RUB 49
            ensure_env PAYMENT_CURRENCY RUB
            ensure_env PAYMENT_ORDER_TTL_MINUTES 30
            ensure_env PAYMENT_WEBHOOK_LISTENER_ENABLED true
            ensure_env PAYMENT_WEBHOOK_HOST 127.0.0.1
            ensure_env PAYMENT_WEBHOOK_PORT 8091
            ensure_env PAYMENT_WEBHOOK_PATH /payments/robokassa/result
            ensure_env ROBOKASSA_HASH_ALGORITHM sha256
            ensure_env ROBOKASSA_PAYMENT_URL https://auth.robokassa.ru/Merchant/Index.aspx
            ensure_env ROBOKASSA_REFUND_URL https://services.robokassa.ru/RefundService/Refund/Create
            ensure_env ROBOKASSA_REFUND_STATUS_URL https://services.robokassa.ru/RefundService/Refund/GetState
            ensure_env PAYMENT_RECEIPT_TAX none
            ensure_env PAYMENT_RECEIPT_ITEM_NAME 'Пакет доступа Ravuna'
            ensure_env DEMO_RETENTION_DAYS 30
            ensure_env PAID_RETENTION_DAYS 180
            ensure_env TRASH_RETENTION_DAYS 30
            ensure_env MAX_BOT_TOKEN ''
            ensure_env MAX_PUBLIC_ACCESS_ENABLED false
            ensure_env MAX_SINGLE_SCREEN_UI_ENABLED true
            ensure_env MAX_OWNER_USER_IDS ''
            ensure_env MAX_PILOT_USER_IDS ''
            ensure_env MAX_API_BASE_URL https://platform-api2.max.ru
            ensure_env MAX_CA_BUNDLE ops/certs/russian_trusted_root_ca_pem.crt
            set_env() {
              NAME="$1"
              VALUE="$2"
              TMP="$ROOT/.env.runtime.tmp"
              grep -v "^$NAME=" "$ROOT/.env" > "$TMP" || true
              printf '%s=%s\n' "$NAME" "$VALUE" >> "$TMP"
              chmod 600 "$TMP"
              mv "$TMP" "$ROOT/.env"
            }
            set_env OPENAI_IMAGE_MODEL gpt-image-2
            ensure_env IMAGE_PROVIDER gemini
            ensure_env GEMINI_IMAGE_MODEL gemini-3-pro-image
            ensure_env IMAGE_DIRECT_PROMPT_ENABLED true
            ensure_env IMAGE_SUBJECT_PRESERVE_GUARD_ENABLED true
            ensure_env IMAGE_FACE_PRESERVE_GUARD_ENABLED true
            if [ "$ACTIVATE_GEMINI" = true ]; then
              set_env IMAGE_PROVIDER gemini
              set_env GEMINI_IMAGE_MODEL gemini-3-pro-image
              set_env IMAGE_DIRECT_PROMPT_ENABLED true
              set_env IMAGE_SUBJECT_PRESERVE_GUARD_ENABLED true
              set_env IMAGE_FACE_PRESERVE_GUARD_ENABLED true
            fi
            set_env IMAGE_EDIT_SIZE auto
            set_env OPENAI_CONVERSATION_MEMORY_ENABLED false
