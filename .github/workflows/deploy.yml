name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photo-bot-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_CONFIGURED: ${{ secrets.REG_RU_HOST != '' && secrets.REG_RU_USER != '' && secrets.REG_RU_SSH_PRIVATE_KEY != '' && secrets.REG_RU_SSH_PORT != '' }}
    steps:
      - name: Report unconfigured deployment
        if: env.DEPLOY_CONFIGURED != 'true'
        run: echo "Deploy skipped until REG.RU repository secrets are configured."
      - uses: actions/checkout@v7
        if: env.DEPLOY_CONFIGURED == 'true'
      - name: Configure SSH
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REG_RU_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.REG_RU_HOST }}
          SSH_PORT: ${{ secrets.REG_RU_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Copy application files
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_HOST: ${{ secrets.REG_RU_HOST }}
          SSH_USER: ${{ secrets.REG_RU_USER }}
          SSH_PORT: ${{ secrets.REG_RU_SSH_PORT }}
        run: |
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=venv \
            --exclude=data \
            --exclude=logs \
            --exclude=temp \
            -czf - . | \
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p /var/www/u3546857/data/apps/photo-bot && tar -xzf - -C /var/www/u3546857/data/apps/photo-bot"
      - name: Install and verify
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_HOST: ${{ secrets.REG_RU_HOST }}
          SSH_USER: ${{ secrets.REG_RU_USER }}
          SSH_PORT: ${{ secrets.REG_RU_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' -- "$GITHUB_SHA" <<'REMOTE'
            set -euo pipefail
            ROOT=/var/www/u3546857/data/apps/photo-bot
            DEPLOY_SHA="$1"
            mkdir -p "$ROOT/data" "$ROOT/logs" "$ROOT/temp"
            if [ ! -f "$ROOT/.env" ]; then
              install -m 600 /dev/null "$ROOT/.env"
            else
              chmod 600 "$ROOT/.env"
            fi
            if ! grep -q '^OPENAI_IMAGE_MODEL=' "$ROOT/.env"; then
              printf '%s\n' 'OPENAI_IMAGE_MODEL=gpt-image-2' >> "$ROOT/.env"
            fi
            if ! grep -q '^APP_ENV=' "$ROOT/.env"; then
              printf '%s\n' 'APP_ENV=production' >> "$ROOT/.env"
            fi
            if ! grep -q '^BASE_DIR=' "$ROOT/.env"; then
              printf '%s\n' 'BASE_DIR=/var/www/u3546857/data/apps/photo-bot' >> "$ROOT/.env"
            fi
            chmod +x "$ROOT"/scripts/*.sh
            cd "$ROOT"
            "$ROOT"/venv/bin/pip install -r "$ROOT"/requirements.txt
            "$ROOT"/venv/bin/python --version
            "$ROOT"/venv/bin/pip check
            "$ROOT"/scripts/healthcheck.sh
            test "$(stat -c '%a' "$ROOT/.env")" = "600"
            for dir in "$ROOT/data" "$ROOT/logs" "$ROOT/temp"; do
              test -d "$dir"
              test -w "$dir"
            done
            for path in app tests scripts requirements.txt README.md AI_REPOSITORY_CONTEXT.md; do
              test -e "$ROOT/$path"
            done
            if [ -f "$ROOT/logs/app.log" ] && grep -Eq '(OPENAI_API_KEY|sk-[A-Za-z0-9_-]{16,})' "$ROOT/logs/app.log"; then
              echo "Potential secret material detected in app.log" >&2
              exit 1
            fi
            if find /var/www/u3546857/data/www/trip-day.ru -maxdepth 5 -iname '*photo-bot*' -print -quit 2>/dev/null | grep -q .; then
              echo "photo-bot files detected inside TripDay" >&2
              exit 1
            fi
            if grep -Eq '^OPENAI_API_KEY=.+$' "$ROOT/.env"; then
              echo "OPENAI_API_KEY is configured"
            else
              echo "OPENAI_API_KEY is not configured; OpenAI check skipped"
            fi
            printf '%s\n' "$DEPLOY_SHA" > "$ROOT/data/deployed_commit.txt.tmp"
            mv "$ROOT/data/deployed_commit.txt.tmp" "$ROOT/data/deployed_commit.txt"
          REMOTE
