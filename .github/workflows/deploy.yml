name: Test and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: photo-bot-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REG_RU_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.REG_RU_HOST }}
          SSH_PORT: ${{ secrets.REG_RU_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Copy application files
        env:
          SSH_HOST: ${{ secrets.REG_RU_HOST }}
          SSH_USER: ${{ secrets.REG_RU_USER }}
          SSH_PORT: ${{ secrets.REG_RU_SSH_PORT }}
        run: |
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=venv \
            --exclude=data \
            --exclude=logs \
            --exclude=temp \
            -czf - . | \
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p /var/www/u3546857/data/apps/photo-bot && tar -xzf - -C /var/www/u3546857/data/apps/photo-bot"
      - name: Install and verify
        env:
          SSH_HOST: ${{ secrets.REG_RU_HOST }}
          SSH_USER: ${{ secrets.REG_RU_USER }}
          SSH_PORT: ${{ secrets.REG_RU_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -e
            ROOT=/var/www/u3546857/data/apps/photo-bot
            chmod +x "$ROOT"/scripts/*.sh
            "$ROOT"/venv/bin/pip install -r "$ROOT"/requirements.txt
            "$ROOT"/scripts/healthcheck.sh'
