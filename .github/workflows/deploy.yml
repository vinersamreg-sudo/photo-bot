name: Ravuna production deploy

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character commit SHA from canonical main history
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: photo-bot-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate canonical deployment target
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require target in canonical main ancestry
        run: |
          git fetch --no-tags origin main
          python scripts/validate_deploy_target.py \
            --target-sha "$TARGET_SHA" \
            --canonical-ref origin/main
      - name: Require successful canonical CI for exact target
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/check-runs?per_page=100" \
            > "$RUNNER_TEMP/check-runs.json"
          python - <<'PY'
          import json
          import os

          with open(os.path.join(os.environ["RUNNER_TEMP"], "check-runs.json"), encoding="utf-8") as stream:
              payload = json.load(stream)
          target = os.environ["TARGET_SHA"]
          passed = any(
              run.get("name") == "Canonical release gate"
              and run.get("head_sha") == target
              and run.get("conclusion") == "success"
              for run in payload.get("check_runs", ())
          )
          if not passed:
              raise SystemExit("Exact target has no successful canonical CI check")
          print("canonical_ci_for_target=success")
          PY
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      STAGE_ROOT: /var/tmp/ravuna-deploy-${{ github.run_id }}-${{ github.run_attempt }}
      SSH_HOST: ${{ secrets.HETZNER_HOST }}
      SSH_USER: ${{ secrets.HETZNER_USER }}
      SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
      TARGET_SHA: ${{ inputs.target_sha }}
      DEPLOY_CONFIGURED: ${{ secrets.HETZNER_HOST != '' && secrets.HETZNER_USER != '' && secrets.HETZNER_SSH_PRIVATE_KEY != '' && secrets.HETZNER_SSH_PORT != '' }}
    steps:
      - name: Require Hetzner deployment configuration
        if: env.DEPLOY_CONFIGURED != 'true'
        run: |
          echo "Hetzner production secrets are incomplete." >&2
          exit 1
      - uses: actions/checkout@v7
        if: env.DEPLOY_CONFIGURED == 'true'
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build byte-exact committed artifact
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/ravuna-release/source"
          python scripts/build_deploy_artifact.py --revision "$TARGET_SHA" \
            --archive "$RUNNER_TEMP/ravuna-release/release.tar.gz" \
            --manifest "$RUNNER_TEMP/ravuna-release/manifest.json"
          tar -xzf "$RUNNER_TEMP/ravuna-release/release.tar.gz" -C "$RUNNER_TEMP/ravuna-release/source"
          python scripts/build_deploy_artifact.py \
            --archive "$RUNNER_TEMP/ravuna-release/release.tar.gz" \
            --manifest "$RUNNER_TEMP/ravuna-release/manifest.json" \
            --verify-directory "$RUNNER_TEMP/ravuna-release/source"
      - name: Configure SSH
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Stage and verify immutable artifact outside production
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -m 700 '$STAGE_ROOT' '$STAGE_ROOT/source'"
          scp -P "$SSH_PORT" "$RUNNER_TEMP/ravuna-release/release.tar.gz" \
            "$RUNNER_TEMP/ravuna-release/manifest.json" "$SSH_USER@$SSH_HOST:$STAGE_ROOT/"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' -- "$STAGE_ROOT" <<'REMOTE'
            set -euo pipefail
            STAGE_ROOT="$1"
            tar --no-same-owner -xzf "$STAGE_ROOT/release.tar.gz" -C "$STAGE_ROOT/source"
            PYTHONDONTWRITEBYTECODE=1 /opt/photo-bot/venv/bin/python \
              "$STAGE_ROOT/source/scripts/build_deploy_artifact.py" \
              --archive "$STAGE_ROOT/release.tar.gz" --manifest "$STAGE_ROOT/manifest.json" \
              --verify-directory "$STAGE_ROOT/source"
          REMOTE
      - name: Capture pre-deploy production snapshot
        id: snapshot
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          set -euo pipefail
          install -d artifact
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' -- "$STAGE_ROOT" <<'REMOTE' | tee artifact/pre-deploy-status.txt
            set -euo pipefail
            STAGE_ROOT="$1"
            cd /opt/photo-bot
            test "$(stat -c '%a:%U:%G' .env)" = "600:photoapp:photoapp"
            venv/bin/python "$STAGE_ROOT/source/scripts/deploy_env_guard.py" capture \
              --env-file /opt/photo-bot/.env --snapshot "$STAGE_ROOT/env-before.json"
            systemctl is-active --quiet photo-bot.service
            systemctl show photo-bot.service -p MainPID --value > "$STAGE_ROOT/old-pid"
            venv/bin/python -m app.main health
            venv/bin/python -m app.main max-check
            venv/bin/python -m app.main payment-reconciliation
            venv/bin/python scripts/production_status.py --root /opt/photo-bot
            venv/bin/python - <<'PY'
          from pathlib import Path

          allowed = (
              "IMAGE_PROVIDER",
              "GEMINI_IMAGE_MODEL",
              "IMAGE_DIRECT_PROMPT_ENABLED",
              "MAX_SINGLE_SCREEN_UI_ENABLED",
          )
          values = {}
          for line in Path("/opt/photo-bot/.env").read_text(encoding="utf-8").splitlines():
              if "=" not in line or line.lstrip().startswith("#"):
                  continue
              key, value = line.split("=", 1)
              values[key.strip()] = value.strip()
          for key in allowed:
              print(f"PRE_{key}={values.get(key, 'missing')}")
          print("PRE_GEMINI_API_KEY_CONFIGURED=" + ("yes" if values.get("GEMINI_API_KEY") else "no"))
          PY
          REMOTE
      - name: Store pre-deploy production snapshot
        if: env.DEPLOY_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-status-${{ github.run_id }}
          path: artifact/pre-deploy-status.txt
          if-no-files-found: error
          retention-days: 14
      - name: Require preinstalled Ravuna payment routes
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            HEADERS=$(mktemp /tmp/ravuna-payment-preflight.XXXXXX)
            trap 'rm -f "$HEADERS"' EXIT
            STATUS=$(curl --silent --show-error --output /dev/null --dump-header "$HEADERS" \
              --write-out '%{http_code}' --resolve ravuna.ru:443:127.0.0.1 \
              https://ravuna.ru/p/00000000000000000000000000000000)
            test "$STATUS" = 404
            grep -Fi 'X-Ravuna-Payment-Route: active' "$HEADERS" >/dev/null
            printf 'ravuna_payment_route_preflight=%s\n' "$STATUS"
          REMOTE
      - name: Verify migration on isolated production database copy
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' -- "$STAGE_ROOT" <<'REMOTE'
            set -euo pipefail
            STAGE_ROOT="$1"
            cd "$STAGE_ROOT/source"
            cmp -s /opt/photo-bot/requirements.txt requirements.txt || {
              echo "Dependency changes require separately approved provisioning of the shared venv." >&2
              exit 1
            }
            /opt/photo-bot/venv/bin/python -m pip check
            export PYTHONDONTWRITEBYTECODE=1
            PYTHONPATH="$STAGE_ROOT/source" /opt/photo-bot/venv/bin/python \
              scripts/check_migration_copy.py \
              --source /opt/photo-bot/data/photo_bot.sqlite3 \
              --copy "$STAGE_ROOT/photo_bot.migrated.sqlite3"
          REMOTE
      - name: Main-bot isolated artifact preflight before service stop
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' -- "$STAGE_ROOT" <<'REMOTE'
            set -euo pipefail
            STAGE_ROOT="$1"
            cd "$STAGE_ROOT/source"
            export PYTHONDONTWRITEBYTECODE=1
            APP_ENV=test BASE_DIR="$STAGE_ROOT/source" MAX_TRANSPORT_MODE=disabled \
              /opt/photo-bot/venv/bin/python -m scripts.main_bot_production_preflight
            /opt/photo-bot/venv/bin/python scripts/check_asset_licenses.py
          REMOTE
      - name: Require idle production before deployment
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            if [ -f /opt/photo-bot/data/photo_bot.sqlite3 ] && [ -x /opt/photo-bot/venv/bin/python ]; then
              /opt/photo-bot/venv/bin/python - <<'PY'
          import sqlite3

          connection = sqlite3.connect("file:/opt/photo-bot/data/photo_bot.sqlite3?mode=ro", uri=True)
          connection.execute("PRAGMA query_only=ON")
          try:
              active = connection.execute(
                  """SELECT
                         (SELECT COUNT(*) FROM generation_attempts
                          WHERE status IN ('pending','processing')) +
                         (SELECT COUNT(*) FROM max_dialogs WHERE state='processing') +
                         (SELECT COUNT(*) FROM generation_credit_reservations WHERE status='reserved')"""
              ).fetchone()[0]
          finally:
              connection.close()
          if active:
              raise SystemExit("Deployment paused: active processing is present")
          print("active_processing=0")
          PY
            fi
          REMOTE
      - name: Synchronize application files
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' -- "$STAGE_ROOT" <<'REMOTE'
            set -euo pipefail
            STAGE_ROOT="$1"
            /opt/photo-bot/venv/bin/python "$STAGE_ROOT/source/scripts/deploy_env_guard.py" verify \
              --env-file /opt/photo-bot/.env --snapshot "$STAGE_ROOT/env-before.json"
            if [ -f /opt/photo-bot/data/photo_bot.sqlite3 ]; then
              install -m 700 -d /opt/photo-bot/data/backups
              BACKUP_FILE="/opt/photo-bot/data/backups/pre-migration-$(date -u +%Y%m%dT%H%M%SZ).sqlite3"
              /opt/photo-bot/venv/bin/python - "$BACKUP_FILE" <<'PY'
          import sqlite3
          import sys

          source = sqlite3.connect("file:/opt/photo-bot/data/photo_bot.sqlite3?mode=ro", uri=True)
          source.execute("PRAGMA query_only=ON")
          backup = sqlite3.connect(sys.argv[1])
          try:
              source.backup(backup)
              result = backup.execute("PRAGMA quick_check").fetchone()
              if not result or result[0] != "ok":
                  raise SystemExit("pre-migration SQLite backup failed quick_check")
          finally:
              backup.close()
              source.close()
          print("sqlite_backup=created")
          PY
              chmod 600 "$BACKUP_FILE"
            fi
            if systemctl cat photo-bot.service >/dev/null 2>&1; then
              sudo -n systemctl stop photo-bot.service
            fi
            if [ -f /opt/photo-bot/data/photo-bot.pid ]; then
              /opt/photo-bot/scripts/stop_bot.sh
            fi
          REMOTE
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='/.github/' \
            --exclude='.env' \
            --exclude='venv/' \
            --exclude='data/' \
            --exclude='logs/' \
            --exclude='temp/' \
            --exclude='/app/content_studio/' \
            --exclude='/marketing/' \
            --exclude='/ops/deploy_ravuna_content_studio.sh' \
            --exclude='/ops/ravuna-content-publisher.service' \
            --exclude='/ops/ravuna-content-publisher.timer' \
            --exclude='/site/' \
            --exclude='/app/admin_journal.py' \
            --exclude='/scripts/run_admin_journal.py' \
            --exclude='/scripts/build_content_studio_release.py' \
            --exclude='/ops/ravuna-admin-journal.service' \
            --exclude='/ops/ravuna-retention-cleanup.service' \
            --exclude='/ops/ravuna-retention-cleanup.timer' \
            --exclude='/tests/test_admin_journal.py' \
            --exclude='/tests/test_content_studio*' \
            -e "ssh -p $SSH_PORT" \
            "$RUNNER_TEMP/ravuna-release/source/" "$SSH_USER@$SSH_HOST:/opt/photo-bot/"
      - name: Install and verify production
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' -- "$TARGET_SHA" "$STAGE_ROOT" <<'REMOTE'
            set -euo pipefail
            ROOT=/opt/photo-bot
            DEPLOY_SHA="$1"
            STAGE_ROOT="$2"
            export PYTHONDONTWRITEBYTECODE=1
            test "$(id -un)" = "photoapp"
            test "$(stat -c '%U:%G' "$ROOT")" = "photoapp:photoapp"
            "$ROOT"/venv/bin/python "$STAGE_ROOT/source/scripts/deploy_env_guard.py" verify \
              --env-file "$ROOT/.env" --snapshot "$STAGE_ROOT/env-before.json"
            printf '%s\n' "$DEPLOY_SHA" > "$ROOT/.deploy-sha"
            chmod 600 "$ROOT/.deploy-sha"
            cd "$ROOT"
            "$ROOT"/venv/bin/python --version
            "$ROOT"/venv/bin/pip check
            "$ROOT"/venv/bin/python - <<'PY'
          from app.config import load_settings
          from app.database import Database, CURRENT_SCHEMA_VERSION
          from scripts.check_migration_copy import _read_only_connection, _commerce_snapshot, _assert_commerce_invariants
          path = load_settings().database_path
          before = _read_only_connection(path)
          try:
              commerce = _commerce_snapshot(before)
          finally:
              before.close()
          Database(path)
          after = _read_only_connection(path)
          try:
              assert after.execute("PRAGMA quick_check").fetchone()[0] == "ok"
              assert after.execute("SELECT MAX(version) FROM schema_migrations").fetchone()[0] == CURRENT_SCHEMA_VERSION
              _assert_commerce_invariants(after)
              assert _commerce_snapshot(after) == commerce, "Migration changed commerce fingerprints"
          finally:
              after.close()
          print("live_migration_commerce=PASS")
          PY
            MAX_TRANSPORT_MODE=disabled "$ROOT"/scripts/healthcheck.sh
            test "$(stat -c '%a' "$ROOT/.env")" = "600"
            test "$(stat -c '%U:%G' "$ROOT/.env")" = "photoapp:photoapp"
            for dir in "$ROOT/data" "$ROOT/logs" "$ROOT/temp"; do
              test -d "$dir"
              test -w "$dir"
            done
            if [ -d "$ROOT/data/users" ]; then
              test "$(stat -c '%a' "$ROOT/data/users")" = "700"
            fi
            if [ -f "$ROOT/data/photo_bot.sqlite3" ]; then
              test "$(stat -c '%a' "$ROOT/data/photo_bot.sqlite3")" = "600"
            fi
            if [ -f "$ROOT/logs/app.log" ]; then
              test "$(stat -c '%a' "$ROOT/logs/app.log")" = "600"
            fi
            for path in app tests scripts docs ops requirements.txt README.md AI_REPOSITORY_CONTEXT.md; do
              test -e "$ROOT/$path"
            done
            if grep -Eq '^OPENAI_API_KEY=.+$' "$ROOT/.env"; then
              echo "OPENAI_API_KEY is configured; external API check intentionally skipped"
            else
              echo "OPENAI_API_KEY is not configured; external API check skipped"
            fi
            if grep -Eq '^GEMINI_API_KEY=.+$' "$ROOT/.env"; then
              echo "GEMINI_API_KEY is configured; external API check intentionally skipped"
            else
              echo "GEMINI_API_KEY is not configured; external API check skipped"
            fi
            MODE=$("$ROOT"/venv/bin/python -c 'from app.config import load_settings; print(load_settings().max_transport_mode)')
            if [ "$MODE" = polling ]; then
              "$ROOT"/venv/bin/python -m app.main max-check
              sudo -n install -o root -g root -m 644 \
                "$ROOT/ops/photo-bot.service" /etc/systemd/system/photo-bot.service
              sudo -n systemctl daemon-reload
              sudo -n systemctl enable photo-bot.service
              RESTART_EPOCH=$(date +%s)
              sudo -n systemctl restart photo-bot.service
              READY=0
              for attempt in $(seq 1 24); do
                if "$ROOT"/scripts/healthcheck.sh && "$ROOT"/venv/bin/python - "$RESTART_EPOCH" <<'PY'
          import sqlite3
          import sys
          from datetime import datetime
          from app.config import load_settings
          connection = sqlite3.connect(f"file:{load_settings().database_path}?mode=ro", uri=True)
          try:
              connection.execute("PRAGMA query_only=ON")
              row = connection.execute("SELECT updated_at FROM max_transport_state WHERE name='poll_last_success'").fetchone()
          finally:
              connection.close()
          raise SystemExit(0 if row and datetime.fromisoformat(row[0]).timestamp() >= int(sys.argv[1]) else 1)
          PY
                then
                  READY=1
                  break
                fi
                sleep 3
              done
              test "$READY" = 1
              MAIN_PID=$(systemctl show photo-bot.service --property=MainPID --value)
              test "$MAIN_PID" -gt 0
              test "$(ps -o user= -p "$MAIN_PID" | xargs)" = photoapp
              tr '\0' ' ' < "/proc/$MAIN_PID/cmdline" | grep -F -- '-m app.main run' >/dev/null
              test "$(pgrep -u photoapp -f '^/opt/photo-bot/venv/bin/python -m app.main run$' | wc -l)" -eq 1

              OLD_PID=$(cat "$STAGE_ROOT/old-pid")
              test "$MAIN_PID" != "$OLD_PID"
              ! kill -0 "$OLD_PID" 2>/dev/null
              test "$(systemctl show photo-bot.service --property=NRestarts --value)" = 0
              "$ROOT"/venv/bin/python -m app.main max-check
            else
              echo "Existing polling configuration is required; provision separately." >&2
              exit 1
            fi
            "$ROOT"/venv/bin/python -m scripts.check_runtime_secrets
            "$ROOT"/venv/bin/python - <<'PY'
          import json
          import os
          import sqlite3
          import time
          from app.config import load_settings
          from app.database import CURRENT_SCHEMA_VERSION

          settings = load_settings()
          connection = sqlite3.connect(f"file:{settings.database_path}?mode=ro", uri=True)
          connection.execute("PRAGMA query_only=ON")
          try:
              quick_check = connection.execute("PRAGMA quick_check").fetchone()[0]
              current_schema = int(connection.execute(
                  "SELECT COALESCE(MAX(version),0) FROM schema_migrations"
              ).fetchone()[0])
              migration_v6 = bool(connection.execute(
                  "SELECT 1 FROM schema_migrations WHERE version=6"
              ).fetchone())
              migration_v7 = bool(connection.execute(
                  "SELECT 1 FROM schema_migrations WHERE version=7"
              ).fetchone())
              migration_v8 = bool(connection.execute(
                  "SELECT 1 FROM schema_migrations WHERE version=8"
              ).fetchone())
              migration_v9 = bool(connection.execute(
                  "SELECT 1 FROM schema_migrations WHERE version=9"
              ).fetchone())
              migration_v10 = bool(connection.execute(
                  "SELECT 1 FROM schema_migrations WHERE version=10"
              ).fetchone())
              migration_v11 = bool(connection.execute(
                  "SELECT 1 FROM schema_migrations WHERE version=11"
              ).fetchone())
              migration_v12 = bool(connection.execute(
                  "SELECT 1 FROM schema_migrations WHERE version=12"
              ).fetchone())
              credit_accounts = connection.execute(
                  "SELECT COUNT(*) FROM user_credit_accounts"
              ).fetchone()[0]
              users = connection.execute("SELECT COUNT(*) FROM users").fetchone()[0]
              negative_credit_accounts = connection.execute(
                  """SELECT COUNT(*) FROM user_credit_accounts
                     WHERE available_generation_credits<0 OR reserved_generation_credits<0"""
              ).fetchone()[0]
              payment_orders_total = connection.execute(
                  "SELECT COUNT(*) FROM payment_orders"
              ).fetchone()[0]
              paid_payment_orders = connection.execute(
                  "SELECT COUNT(*) FROM payment_orders WHERE status IN ('paid','delivered')"
              ).fetchone()[0]
              payment_events_total = connection.execute(
                  "SELECT COUNT(*) FROM payment_events"
              ).fetchone()[0]
              sale_receipts_total = connection.execute(
                  """SELECT COUNT(*) FROM payment_receipts
                     WHERE receipt_type='payment'"""
              ).fetchone()[0]
              continuation_pack_grants_total = connection.execute(
                  "SELECT COUNT(*) FROM continuation_pack_grants"
              ).fetchone()[0]
          finally:
              connection.close()
          assert quick_check == "ok"
          assert current_schema == CURRENT_SCHEMA_VERSION
          assert migration_v6
          assert migration_v7
          assert migration_v8
          assert migration_v9
          assert migration_v10
          assert migration_v11
          assert migration_v12
          assert credit_accounts == users
          assert negative_credit_accounts == 0
          assert settings.payment_webhook_listener_enabled is True
          assert settings.payment_refunds_enabled is False
          assert settings.robokassa_hash_algorithm == "sha256"
          if settings.payments_enabled:
              assert settings.payment_provider == "robokassa"
              assert settings.payment_webhook_enabled is True
              assert settings.robokassa_mode == "production"
              assert settings.robokassa_production_approved is True
              assert settings.robokassa_merchant_login
              assert settings.robokassa_password1
              assert settings.robokassa_password2
          else:
              assert settings.payment_provider == "disabled"
              assert settings.payment_webhook_enabled is False
              assert settings.robokassa_mode == "sandbox"
              assert settings.robokassa_production_approved is False
          assert settings.payment_result_url == "https://pixoraai.ru/payments/robokassa/result"
          assert settings.payment_success_url == (
              "https://ravuna.ru/payment-success.html"
          )
          assert settings.payment_fail_url == (
              "https://ravuna.ru/payment-failed.html"
          )
          assert settings.payment_receipt_item_name == (
              "Пакет доступа Ravuna"
          )
          assert settings.payment_receipt_tax == "none"
          assert settings.openai_conversation_memory_enabled is False
          assert settings.openai_responses_image_enabled is False
          assert settings.openai_conversation_retention_enabled is False
          assert settings.max_single_screen_ui_enabled is True
          stale_processing_orphans = 0
          cutoff = time.time() - 3600
          for path in settings.temp_dir.iterdir():
              if not path.name.startswith(("pixora-mask-", "pixora-composite-")):
                  continue
              if path.is_symlink() or path.stat().st_mtime > cutoff:
                  continue
              stale_processing_orphans += 1
          assert stale_processing_orphans == 0
          memory_total_mb = 0
          try:
              for line in open("/proc/meminfo", encoding="utf-8"):
                  if line.startswith("MemTotal:"):
                      memory_total_mb = int(line.split()[1]) // 1024
                      break
          except OSError:
              pass
          print("runtime_audit=" + json.dumps({
              "provider": settings.image_provider,
              "model": (
                  settings.gemini_image_model
                  if settings.image_provider == "gemini"
                  else settings.nanobanana_image_model
                  if settings.image_provider == "nanobanana"
                  else settings.openai_image_model
              ),
              "endpoint": (
                  "/v1beta/interactions"
                  if settings.image_provider in {"gemini", "nanobanana"}
                  else "/v1/images/edits"
              ),
              "direct_prompt_enabled": settings.image_direct_prompt_enabled,
              "single_screen_ui_enabled": settings.max_single_screen_ui_enabled,
              "gemini_api_key_configured": bool(settings.gemini_api_key),
              "quality": settings.image_edit_quality,
              "size": settings.image_edit_size,
              "input_fidelity_config": settings.image_edit_input_fidelity,
              "input_fidelity_sent": (
                  not settings.openai_image_model.startswith("gpt-image-2")
                  and settings.image_edit_input_fidelity != "auto"
              ),
              "output_format": settings.image_edit_output_format,
              "timeout_seconds": settings.generation_timeout_seconds,
              "max_retries": settings.openai_max_retries,
              "transport": settings.max_transport_mode,
              "observe_only": settings.max_poll_observe_only,
              "owner_allowlist_configured": bool(settings.max_owner_user_ids),
              "processing_mode_router_enabled": settings.processing_mode_router_enabled,
              "real_background_composite_enabled": settings.real_background_composite_enabled,
              "segmentation_backend": settings.segmentation_backend,
              "local_ai_finishing_enabled": settings.local_ai_finishing_enabled,
              "cpu_count": os.cpu_count(),
              "memory_total_mb": memory_total_mb,
              "stale_processing_orphans": stale_processing_orphans,
              "sqlite_quick_check": quick_check,
              "schema_version": current_schema,
              "migration_v6": migration_v6,
              "migration_v7": migration_v7,
              "migration_v8": migration_v8,
              "migration_v9": migration_v9,
              "migration_v10": migration_v10,
              "migration_v11": migration_v11,
              "migration_v12": migration_v12,
              "credit_accounts": credit_accounts,
              "negative_credit_accounts": negative_credit_accounts,
              "payment_orders_total": payment_orders_total,
              "paid_payment_orders": paid_payment_orders,
              "payment_events_total": payment_events_total,
              "sale_receipts_total": sale_receipts_total,
              "continuation_pack_grants_total": continuation_pack_grants_total,
              "payments_enabled": settings.payments_enabled,
              "payment_webhook_listener_enabled": settings.payment_webhook_listener_enabled,
              "payment_webhook_enabled": settings.payment_webhook_enabled,
              "payment_refunds_enabled": settings.payment_refunds_enabled,
              "robokassa_mode": settings.robokassa_mode,
              "robokassa_hash_algorithm": settings.robokassa_hash_algorithm,
              "robokassa_merchant_login_configured": bool(settings.robokassa_merchant_login),
              "robokassa_password1_configured": bool(settings.robokassa_password1),
              "robokassa_password2_configured": bool(settings.robokassa_password2),
              "robokassa_password3_configured": bool(settings.robokassa_password3),
              "payment_result_url": settings.payment_result_url,
              "payment_success_url": settings.payment_success_url,
              "payment_fail_url": settings.payment_fail_url,
              "payment_receipt_item_name": settings.payment_receipt_item_name,
              "payment_receipt_tax": settings.payment_receipt_tax,
              "openai_conversation_memory_enabled": settings.openai_conversation_memory_enabled,
              "openai_responses_image_enabled": settings.openai_responses_image_enabled,
              "openai_conversation_retention_enabled": (
                  settings.openai_conversation_retention_enabled
              ),
          }, sort_keys=True))
          PY
            "$ROOT"/venv/bin/python -m app.main payment-reconciliation
            "$ROOT"/venv/bin/python -m app.main payment-status --format json
            "$ROOT"/venv/bin/python -m app.main launch-status
            "$ROOT"/venv/bin/python "$STAGE_ROOT/source/scripts/deploy_env_guard.py" verify \
              --env-file "$ROOT/.env" --snapshot "$STAGE_ROOT/env-before.json"
            printf '%s\n' "$DEPLOY_SHA" > "$ROOT/data/deployed_commit.txt.tmp"
            mv "$ROOT/data/deployed_commit.txt.tmp" "$ROOT/data/deployed_commit.txt"
            test "$(cat "$ROOT/data/deployed_commit.txt")" = "$DEPLOY_SHA"
            printf 'deployed_commit=%s\n' "$DEPLOY_SHA"
          REMOTE
      - name: Verify ResultURL transport
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            GET_STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --resolve pixoraai.ru:443:127.0.0.1 \
              https://pixoraai.ru/payments/robokassa/result)
            test "$GET_STATUS" = 405
            printf 'resulturl_get_status=%s\n' "$GET_STATUS"
            WEBHOOK_ENABLED=$(cd /opt/photo-bot && venv/bin/python -c 'from app.config import load_settings; print(str(load_settings().payment_webhook_enabled).lower())')
            if [ "$WEBHOOK_ENABLED" = true ]; then
              printf 'resulturl_post_probe=skipped_enabled\n'
            else
              POST_STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --resolve pixoraai.ru:443:127.0.0.1 \
                --request POST --data 'readiness_probe=1' \
                https://pixoraai.ru/payments/robokassa/result)
              test "$POST_STATUS" = 503
              printf 'resulturl_post_disabled_status=%s\n' "$POST_STATUS"
            fi
          REMOTE
      - name: Verify environment preservation even on deployment failure
        if: always() && steps.snapshot.outcome == 'success'
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "/opt/photo-bot/venv/bin/python '$STAGE_ROOT/source/scripts/deploy_env_guard.py' verify --env-file /opt/photo-bot/.env --snapshot '$STAGE_ROOT/env-before.json'"
