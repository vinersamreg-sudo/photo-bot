name: Ravuna controlled streaming recovery proof

# One authorized operation on an unmerged ops branch. No schedule or deployment.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: photo-bot-production
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMPLEMENTATION_SHA: 0135c1d639952584c2bf2c639e87fba08a434a13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require exact merged implementation and green CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)" = "$IMPLEMENTATION_SHA"
          gh api repos/${GITHUB_REPOSITORY}/commits/${IMPLEMENTATION_SHA}/check-runs > checks.json
          python - <<'PY'
          import json
          checks=json.load(open('checks.json'))['check_runs']
          for name in ('Canonical release gate','Site release gate'):
              candidates=[c for c in checks if c['name']==name]
              assert candidates and max(candidates,key=lambda c:c['id'])['conclusion']=='success',name
          print('merged_implementation_ci=PASS')
          PY
          mkdir staging
          git archive "$IMPLEMENTATION_SHA" app/backup.py | tar -x -C staging
          sha256sum staging/app/backup.py | cut -d ' ' -f1 > staging/module.sha256
      - name: Configure approved SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Stage isolated backup code only
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          set -euo pipefail
          STAGE=$(ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'umask 077; mktemp -d /var/tmp/ravuna-streaming-backup.XXXXXX')
          case "$STAGE" in /var/tmp/ravuna-streaming-backup.*) ;; *) exit 1 ;; esac
          printf 'STAGE=%s\n' "$STAGE" >> "$GITHUB_ENV"
          scp -P "$SSH_PORT" staging/app/backup.py staging/module.sha256 ops/controlled_recovery_once.py "$SSH_USER@$SSH_HOST:$STAGE/"
      - name: Exactly one recovery creation and isolated restore proof
        id: proof
        env:
          PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PASSPHRASE" | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "/opt/photo-bot/venv/bin/python -B '$STAGE/controlled_recovery_once.py' create '$IMPLEMENTATION_SHA' '$GITHUB_RUN_ID'" > proof.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,re
          p=json.load(open('proof.json'))
          assert p['overall']=='PASS'
          assert re.fullmatch(r'ravuna-recovery-[0-9TZ]+\.tar\.gz\.enc',p['backup_name'])
          assert re.fullmatch(r'[0-9a-f]{64}',p['sha256'])
          print('backup_name='+p['backup_name'])
          print('sha256='+p['sha256'])
          PY
          python - <<'PY'
          import json
          p=json.load(open('proof.json'))
          print(json.dumps({k:p[k] for k in ('backup_name','size_bytes','overall','migration','source_revision','implementation_sha','prune_disabled','old_backups_preserved','service_unchanged','env_unchanged')}))
          PY
      - name: Copy and verify encrypted artifact off VPS
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
          NAME: ${{ steps.proof.outputs.backup_name }}
          DIGEST: ${{ steps.proof.outputs.sha256 }}
        run: |
          set -euo pipefail
          install -d artifact
          scp -P "$SSH_PORT" "$SSH_USER@$SSH_HOST:/opt/photo-bot/data/backups/$NAME" "artifact/$NAME"
          printf '%s  %s\n' "$DIGEST" "artifact/$NAME" | sha256sum -c -
      - name: Store encrypted off-site recovery artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ravuna-controlled-recovery-${{ github.run_id }}
          path: artifact/*.enc
          if-no-files-found: error
          retention-days: 14
      - name: Confirm verified off-site artifact
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "/opt/photo-bot/venv/bin/python -B '$STAGE/controlled_recovery_once.py' confirm '$IMPLEMENTATION_SHA' '$GITHUB_RUN_ID' '$ARTIFACT_ID'"
      - name: Remove isolated code staging only
        if: always()
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          set -euo pipefail
          if test -n "${STAGE:-}"; then
            case "$STAGE" in /var/tmp/ravuna-streaming-backup.*) ;; *) exit 1 ;; esac
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "test -d '$STAGE' && test ! -L '$STAGE' && rm -r -- '$STAGE'"
          fi
