name: Ravuna encrypted production backup

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photo-bot-production
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    env:
      BACKUP_CONFIGURED: ${{ secrets.HETZNER_HOST != '' && secrets.HETZNER_USER != '' && secrets.HETZNER_SSH_PRIVATE_KEY != '' && secrets.HETZNER_SSH_PORT != '' && secrets.BACKUP_ENCRYPTION_PASSPHRASE != '' }}
    steps:
      - name: Require backup configuration
        if: env.BACKUP_CONFIGURED != 'true'
        run: |
          echo "Encrypted production backup configuration is incomplete." >&2
          exit 1
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Create encrypted server backups
        id: create
        env:
          PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          BACKUP_NAMES=$(printf '%s\n' "$PASSPHRASE" | \
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -euo pipefail
              IFS= read -r PASSPHRASE
              cd /opt/photo-bot
              REPORT=$(printf "%s\n" "$PASSPHRASE" | venv/bin/python -m app.main backup-create --passphrase-stdin)
              NAME=$(printf "%s" "$REPORT" | venv/bin/python -c "import json,sys; print(json.load(sys.stdin)[\"backup_name\"])")
              SHA=$(printf "%s" "$REPORT" | venv/bin/python -c "import json,sys; print(json.load(sys.stdin)[\"sha256\"])")
              RECOVERY_REPORT=$(printf "%s\n" "$PASSPHRASE" | venv/bin/python -m app.main recovery-create --passphrase-stdin)
              RECOVERY_NAME=$(printf "%s" "$RECOVERY_REPORT" | venv/bin/python -c "import json,sys; print(json.load(sys.stdin)[\"recovery_bundle_name\"])")
              RECOVERY_SHA=$(printf "%s" "$RECOVERY_REPORT" | venv/bin/python -c "import json,sys; print(json.load(sys.stdin)[\"sha256\"])")
              printf "%s\t%s\t%s\t%s\n" "$NAME" "$SHA" "$RECOVERY_NAME" "$RECOVERY_SHA"')
          IFS=$'\t' read -r BACKUP_NAME BACKUP_SHA RECOVERY_NAME RECOVERY_SHA <<< "$BACKUP_NAMES"
          test -n "$BACKUP_NAME"
          test "$BACKUP_SHA" != ""
          test -n "$RECOVERY_NAME"
          test "$RECOVERY_SHA" != ""
          case "$BACKUP_NAME" in pixora-*.sqlite3.enc) ;; *) exit 1 ;; esac
          case "$RECOVERY_NAME" in ravuna-recovery-*.tar.gz.enc) ;; *) exit 1 ;; esac
          case "$BACKUP_SHA" in *[!0-9a-fA-F]*|'') exit 1 ;; esac
          case "$RECOVERY_SHA" in *[!0-9a-fA-F]*|'') exit 1 ;; esac
          test "${#BACKUP_SHA}" -eq 64
          test "${#RECOVERY_SHA}" -eq 64
          printf 'backup_name=%s\n' "$BACKUP_NAME" >> "$GITHUB_OUTPUT"
          printf 'backup_sha=%s\n' "$BACKUP_SHA" >> "$GITHUB_OUTPUT"
          printf 'recovery_name=%s\n' "$RECOVERY_NAME" >> "$GITHUB_OUTPUT"
          printf 'recovery_sha=%s\n' "$RECOVERY_SHA" >> "$GITHUB_OUTPUT"
      - name: Copy encrypted backups off the VPS
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
          BACKUP_NAME: ${{ steps.create.outputs.backup_name }}
          RECOVERY_NAME: ${{ steps.create.outputs.recovery_name }}
          BACKUP_SHA: ${{ steps.create.outputs.backup_sha }}
          RECOVERY_SHA: ${{ steps.create.outputs.recovery_sha }}
        run: |
          install -d artifact
          scp -P "$SSH_PORT" "$SSH_USER@$SSH_HOST:/opt/photo-bot/data/backups/$BACKUP_NAME" "artifact/$BACKUP_NAME"
          scp -P "$SSH_PORT" "$SSH_USER@$SSH_HOST:/opt/photo-bot/data/backups/$RECOVERY_NAME" "artifact/$RECOVERY_NAME"
          printf '%s  %s\n' "$BACKUP_SHA" "artifact/$BACKUP_NAME" | sha256sum -c -
          printf '%s  %s\n' "$RECOVERY_SHA" "artifact/$RECOVERY_NAME" | sha256sum -c -
      - name: Store encrypted off-site artifact
        uses: actions/upload-artifact@v4
        with:
          name: ravuna-production-backup-${{ github.run_id }}
          path: artifact/*.enc
          if-no-files-found: error
          retention-days: 14
      - name: Confirm encrypted off-site copy
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
          BACKUP_NAME: ${{ steps.create.outputs.backup_name }}
          RECOVERY_NAME: ${{ steps.create.outputs.recovery_name }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' -- "$BACKUP_NAME" "$RECOVERY_NAME" <<'REMOTE'
            set -euo pipefail
            cd /opt/photo-bot
            venv/bin/python -m app.main backup-mark-offsite --backup "$1" --provider github-actions >/dev/null
            venv/bin/python -m app.main recovery-mark-offsite --backup "$2" --provider github-actions >/dev/null
          REMOTE
