name: Ravuna encrypted production backup

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photo-bot-production
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    env:
      BACKUP_CONFIGURED: ${{ secrets.HETZNER_HOST != '' && secrets.HETZNER_USER != '' && secrets.HETZNER_SSH_PRIVATE_KEY != '' && secrets.HETZNER_SSH_PORT != '' && secrets.BACKUP_ENCRYPTION_PASSPHRASE != '' }}
    steps:
      - name: Require backup configuration
        if: env.BACKUP_CONFIGURED != 'true'
        run: |
          echo "Encrypted production backup configuration is incomplete." >&2
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Create and restore-test encrypted server backup
        id: create
        env:
          PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          BACKUP_NAME=$(printf '%s\n' "$PASSPHRASE" | \
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -euo pipefail
              IFS= read -r PASSPHRASE
              cd /opt/photo-bot
              REPORT=$(printf "%s\n" "$PASSPHRASE" | venv/bin/python -m app.main backup-create --passphrase-stdin)
              NAME=$(printf "%s" "$REPORT" | venv/bin/python -c "import json,sys; print(json.load(sys.stdin)[\"backup_name\"])")
              printf "%s\n" "$NAME"
              printf "%s\n" "$PASSPHRASE" | venv/bin/python -m app.main backup-restore-test --backup "$NAME" --passphrase-stdin >/dev/null')
          test -n "$BACKUP_NAME"
          case "$BACKUP_NAME" in pixora-*.sqlite3.enc) ;; *) exit 1 ;; esac
          printf 'backup_name=%s\n' "$BACKUP_NAME" >> "$GITHUB_OUTPUT"
      - name: Copy encrypted backup off the VPS
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
          BACKUP_NAME: ${{ steps.create.outputs.backup_name }}
        run: |
          install -d artifact
          scp -P "$SSH_PORT" "$SSH_USER@$SSH_HOST:/opt/photo-bot/data/backups/$BACKUP_NAME" "artifact/$BACKUP_NAME"
      - name: Independently restore-test copied artifact
        env:
          PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          BACKUP_NAME: ${{ steps.create.outputs.backup_name }}
        run: |
          printf '%s\n' "$PASSPHRASE" | env \
            APP_ENV=ci BASE_DIR="$GITHUB_WORKSPACE" OPENAI_IMAGE_MODEL=gpt-image-2 \
            BACKUP_DIR="$GITHUB_WORKSPACE/artifact" \
            python -m app.main backup-restore-test --backup "$BACKUP_NAME" --passphrase-stdin
      - name: Store encrypted off-site artifact
        uses: actions/upload-artifact@v4
        with:
          name: ravuna-production-backup-${{ github.run_id }}
          path: artifact/*.sqlite3.enc
          if-no-files-found: error
          retention-days: 14
      - name: Confirm off-site copy and run cleanup
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
          BACKUP_NAME: ${{ steps.create.outputs.backup_name }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' -- "$BACKUP_NAME" <<'REMOTE'
            set -euo pipefail
            cd /opt/photo-bot
            venv/bin/python -m app.main backup-mark-offsite --backup "$1" --provider github-actions >/dev/null
            venv/bin/python -m app.main maintenance-cleanup --execute
            venv/bin/python -m app.main launch-status --strict
          REMOTE
