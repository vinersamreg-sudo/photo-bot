# Final HTTPS configuration. Install only after the certificate for both names exists.
limit_req_zone $binary_remote_addr zone=robokassa_result:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name pixoraai.ru www.pixoraai.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/pixora-site/shared/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://pixoraai.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pixoraai.ru;

    ssl_certificate /etc/letsencrypt/live/pixoraai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixoraai.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RavunaLegacyTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://pixoraai.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pixoraai.ru;

    root /opt/pixora-site/current;
    index index.html;
    autoindex off;
    disable_symlinks if_not_owner from=$document_root;

    ssl_certificate /etc/letsencrypt/live/pixoraai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixoraai.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RavunaLegacyTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; manifest-src 'self'; media-src 'self'; object-src 'none'; script-src 'self' 'sha256-M8xxBHxdmpNylJVecx7VTZqu2p5F3O9UZ3S4hKsvqt8='; style-src 'self'; upgrade-insecure-requests" always;

    location ~* (?:^|/)(?:\.env|\.git|.*\.(?:sqlite(?:3)?|db|log|bak|old|map|sql|zip|tar|gz))$ {
        return 404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /opt/pixora-site/shared/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Public transport for the classic Robokassa ResultURL. The loopback
    # listener remains fail-closed (503) until the explicit business webhook
    # flag is enabled for a controlled sandbox window.
    location = /payments/robokassa/result {
        client_max_body_size 64k;
        limit_req zone=robokassa_result burst=20 nodelay;
        access_log off;
        proxy_pass http://127.0.0.1:8091/payments/robokassa/result;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(?:css|js|svg|webp|ico|woff2)$ {
        expires 1d;
        try_files $uri =404;
    }

    location ~* \.(?:html|txt|xml|json|webmanifest)$ {
        expires -1;
        try_files $uri =404;
    }
}
