# Final HTTPS configuration. Install only after the certificate for both names exists.
server {
    listen 80;
    listen [::]:80;
    server_name ravuna.ru www.ravuna.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/ravuna-site/shared/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://ravuna.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ravuna.ru;

    ssl_certificate /etc/letsencrypt/live/ravuna.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ravuna.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RavunaTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://ravuna.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ravuna.ru;

    root /opt/ravuna-site/current;
    index index.html;
    autoindex off;
    disable_symlinks if_not_owner from=$document_root;

    ssl_certificate /etc/letsencrypt/live/ravuna.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ravuna.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RavunaTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; manifest-src 'self'; media-src 'self'; object-src 'none'; script-src 'self' 'sha256-IGw8IrclNIWG29lcRNH886TXksJfT3s49nEuoJTuX3w='; style-src 'self'; upgrade-insecure-requests" always;

    location ~* (?:^|/)(?:\.env|\.git|.*\.(?:sqlite(?:3)?|db|log|bak|old|map|sql|zip|tar|gz))$ {
        return 404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /opt/ravuna-site/shared/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Exact opaque payment and return routes only. The application listener
    # remains loopback-only and ResultURL keeps its separate callback boundary.
    location ~ ^/(?:p|payment/(?:success|fail))/[0-9a-f]{32}/?$ {
        proxy_pass http://127.0.0.1:8091$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        access_log off;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(?:css|js|svg|webp|ico|woff2)$ {
        expires 1d;
        try_files $uri =404;
    }

    location ~* \.(?:html|txt|xml|json|webmanifest)$ {
        expires -1;
        try_files $uri =404;
    }
}
