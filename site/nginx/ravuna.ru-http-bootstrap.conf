# Temporary HTTP-only configuration for DNS cutover and ACME issuance.
# Replace with ravuna.ru.conf immediately after a certificate for both names exists.
server {
    listen 80;
    listen [::]:80;
    server_name ravuna.ru www.ravuna.ru;

    root /opt/ravuna-site/current;
    index index.html;
    autoindex off;
    disable_symlinks if_not_owner from=$document_root;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; manifest-src 'self'; media-src 'self'; object-src 'none'; script-src 'self' 'sha256-IGw8IrclNIWG29lcRNH886TXksJfT3s49nEuoJTuX3w='; style-src 'self'" always;

    location ~* (?:^|/)(?:\.env|\.git|.*\.(?:sqlite(?:3)?|db|log|bak|old|map|sql|zip|tar|gz))$ {
        return 404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /opt/ravuna-site/shared/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
